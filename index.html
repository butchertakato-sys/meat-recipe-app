            <div class="grid menu-grid">
              ${records.map((record) => `
                <button class="menu-button" type="button" data-type="record-detail" data-id="${manufacturingRecordId(record)}">
                  <strong>${escapeHtml(record.date || "日付未入力")} ${escapeHtml(record.recipeName || record.product || "レシピ未入力")}</strong>
                  <span>仕込み日: ${escapeHtml(record.prepDate || "")} / ${escapeHtml(record.category || "")} / ロット: ${escapeHtml(record.lot || "未入力")} / ${isCombinedHerbManufacturingRecord(record) ? `製品用: ${escapeHtml(record.herbStandardPackageCount || "0")}パック / イベント用: ${escapeHtml(record.herbEventPieceCount || "0")}本` : `${escapeHtml(record.packagingUnit === "本" ? "完成本数" : "包装数")}: ${escapeHtml((record.packagingUnit === "本" ? record.completedCount : record.packageCount) || "0")}`} / ロス本数: ${escapeHtml(record.lossCount || "0")} / 実績歩留まり: ${yieldDisplayText(record)}${record.syncStatus === "pending" ? " / 未同期" : record.syncStatus === "error" ? ` / 同期エラー${record.syncError ? `（${escapeHtml(String(record.syncError)).slice(0, 160)}）` : ""}` : ""}</span>

      if (window.MeatProductionSync) {

          const status = document.getElementById("recordHistorySyncTime");

    async function collectPastManufacturingDiagnosticSnapshot() {
      const errors = [];
      const read = (key, label) => {
        try {
          const raw = localStorage.getItem(key);
          if (raw == null) return [];
          const rows = JSON.parse(raw);
          if (!Array.isArray(rows) || rows.some((r) => !r || typeof r !== "object")) throw new Error("記録の配列形式ではありません");
          return rows;
        } catch (error) { errors.push(`${label}: ${error.message}`); return []; }
      };
      const snapshot = {
        archive: read(OLD_MANUFACTURING_RECORDS_KEY, "旧v1製造履歴"),
        local: read(MANUFACTURING_RECORDS_KEY, "現行local製造履歴"),
        savedArchive: read(OLD_SAVED_RECIPE_CALCULATIONS_KEY, "旧v1保存済みレシピ"),
        savedLocal: read(SAVED_RECIPE_CALCULATIONS_KEY, "現行保存済みレシピ"),
        errors, capturedAt: new Date().toISOString()
      };
      const results = await Promise.allSettled([
        window.MeatProductionSync.getLocalHistory(), window.MeatProductionSync.fetchCloudHistory({ lots: window.MeatHistoryDiagnostics.TARGETS.map((t) => t.lot) })
      ]);
      snapshot.indexed = results[0].status === "fulfilled" ? results[0].value : [];
      if (results[1].status === "fulfilled" && results[1].value.length >= 1000) errors.push("Supabase取得上限の可能性があるため所在未確定");
      snapshot.cloud = results[1].status === "fulfilled" ? results[1].value.map((row) => {
        if (!Array.isArray(row.manufacturing_allocations)) errors.push(`Supabase内訳未取得: ${row.id}`);
        return { record: row, allocations: row.manufacturing_allocations || [] };
      }) : [];
      results.forEach((r, index) => { if (r.status === "rejected") errors.push(`${index ? "Supabase" : "IndexedDB"}: ${r.reason.message || r.reason}`); });
      return snapshot;
    }

    async function runPastManufacturingDiagnostics() {
      if (crossDeviceIntegrationPromise) await crossDeviceIntegrationPromise.catch(() => {});
      await window.MeatProductionSync.waitForIdle();
      const snapshot = await collectPastManufacturingDiagnosticSnapshot();
      const reports = window.MeatHistoryDiagnostics.TARGETS.map((t) => window.MeatHistoryDiagnostics.inspect(snapshot, t));
      const recoverable = reports.filter((r) => r.canRecover);
      if (recoverable.length) {
        await initializeSupabaseMasterData();
        if (window.MeatProductionMasterData) {
          const master = await window.MeatProductionMasterData.refresh();
          if (master && master.data) applySupabaseMasterData(master.data);
        }
      }
      for (const report of recoverable) {
        try {
          const freshCloud = await window.MeatProductionSync.fetchCloudHistory({ lots: window.MeatHistoryDiagnostics.TARGETS.map((t) => t.lot) });
          const before = snapshot.cloud.filter((b) => b.record.lot_number === report.lot);
          const fresh = freshCloud.filter((r) => r.lot_number === report.lot);
          if (JSON.stringify(before.map((b) => b.record)) !== JSON.stringify(fresh)) throw new Error("診断中にクラウド記録が変更されました。自動上書きしません。");
          const existingCloud = before[0] && before[0].record;
          const bundle = window.MeatProductionSyncAdapter.fromLegacy({ ...report.record,
            createdAt: (existingCloud && existingCloud.created_at) || report.record.createdAt,
            updatedAt: new Date().toISOString()
          }, window.MEAT_SUPABASE_CONFIG || {}, window.MeatProductionSync);
          if (bundle.record.lot_number !== report.lot) throw new Error("LOTが一致しません");
          const cloudAllocations = before.flatMap((b) => b.allocations);
          const result = await window.MeatProductionSync.upsertDiagnosticRecovery(bundle.record, bundle.allocations, cloudAllocations);
          if (!result.synced) throw result.error;
          const verified = await window.MeatProductionSync.fetchCloudHistory({ lots: window.MeatHistoryDiagnostics.TARGETS.map((t) => t.lot) });
          const saved = verified.find((r) => r.id === bundle.record.id && r.lot_number === report.lot);
          if (!saved) throw new Error("クラウド保存後の取得で記録を確認できません");
          const actual = window.MeatHistoryRecovery.fromBundle({ record: saved, allocations: saved.manufacturing_allocations });
          for (const [key, value] of Object.entries(report.quantities)) if (Number(actual[key]) !== value) throw new Error(`保存後の数量が一致しません: ${key}`);
          const localBundles = await window.MeatProductionSync.getLocalHistory();
          const local = localBundles.find((b) => b.record.id === bundle.record.id);
          const localRecord = local && window.MeatHistoryRecovery.fromBundle(local);
          for (const [key, value] of Object.entries(report.quantities)) if (!localRecord || Number(localRecord[key]) !== value) throw new Error(`端末保存後の数量が一致しません: ${key}`);
          const canonical = { ...report.record, ...bundle.legacyRecordPatch, syncStatus: "synced", syncError: "", createdAt: bundle.record.created_at, updatedAt: bundle.record.updated_at };
          const current = JSON.parse(localStorage.getItem(MANUFACTURING_RECORDS_KEY) || "[]");
          const exists = current.some((r) => r.lot === report.lot);
          const updated = current.map((r) => r.lot === report.lot ? { ...r, ...canonical } : r);
          if (!exists) updated.push(canonical);
          saveManufacturingRecords(updated);
          report.result = `復旧済み（${Object.entries(report.quantities).map(([k, v]) => `${k}=${v}`).join(" / ")}・IndexedDB / Supabase確認済み`;
        } catch (error) { report.result = `復旧未完了：${error.message || error}`; }
      }
      return { snapshot, reports, text: `過去データ診断\n取得日時: ${snapshot.capturedAt}\n対象3LOT・取得時の生データ（復旧前）\n\n` + reports.map(window.MeatHistoryDiagnostics.text).join("\n\n--------------------------------\n\n") };
    }

    async function showPastManufacturingDiagnostics() {
      if (manufacturingDiagnosticRun) return;
      manufacturingDiagnosticsVisible = true;
      setHeader("過去データ診断", "対象3LOTを一括確認", true, () => showManufacturingRecordHistory());
      app.innerHTML = `<section class="section"><h2>過去データ診断</h2><p role="status">実データを取得しています。明示製造数が一意に残っている場合だけ自動復旧します。</p></section>`;
      manufacturingDiagnosticRun = runPastManufacturingDiagnostics();
      try {
        const result = await manufacturingDiagnosticRun;
        if (!manufacturingDiagnosticsVisible) return;
        app.innerHTML = result.reports.map((r) => `
          <section class="section">
            <h2>${escapeHtml(r.name)}</h2><div class="note">LOT: ${escapeHtml(r.lot)}</div>
            <p>${escapeHtml(r.decision)}</p><p>${escapeHtml(r.result)}</p>

    async function refreshManufacturingHistory(showResult = false) {
      if (manufacturingDiagnosticsVisible) return;
      const integrationResult = await runCrossDeviceIntegration().catch(() => null);
      if (manufacturingDiagnosticsVisible) return;
      let localRecords = [];
      const legacyCount = loadManufacturingRecords().length;
      try {
        localRecords = await loadIndexedManufacturingHistory();
        const pendingCount = window.MeatProductionSync ? await window.MeatProductionSync.pendingCount().catch(() => 0) : 0;
        renderManufacturingRecordHistory(
          combinedManufacturingHistory(localRecords),
          "",
          "",
          { indexedCount: localRecords.length, legacyCount, pendingCount, cloudCount: null, syncError: "" }
        );
      } catch (error) {
        renderManufacturingRecordHistory(loadManufacturingRecords());
      }
      try {
        if (manufacturingDiagnosticsVisible) return;
        const syncResult = integrationResult && integrationResult.historyRefresh
          ? integrationResult.historyRefresh
          : await window.MeatProductionSync.refreshHistoryCache();
        const refreshed = await loadIndexedManufacturingHistory();
        const pendingCount = await window.MeatProductionSync.pendingCount().catch(() => 0);
        renderManufacturingRecordHistory(
          combinedManufacturingHistory(refreshed),
          showResult ? "最新データへ更新しました。" : "",
          "",
          {
            indexedCount: refreshed.length,
            legacyCount,
            pendingCount,
            cloudCount: syncResult && Number.isFinite(Number(syncResult.updatedCount)) ? Number(syncResult.updatedCount) : null,
            syncError: ""
          }
        );
      } catch (error) {
        const cached = localRecords.length ? localRecords : await loadIndexedManufacturingHistory().catch(() => []);
        const combined = combinedManufacturingHistory(cached);
        const pendingCount = window.MeatProductionSync ? await window.MeatProductionSync.pendingCount().catch(() => 0) : 0;
        renderManufacturingRecordHistory(
          combined,
          "",
          combined.length ? "オフラインのため、この端末に保存されている製造履歴を表示しています。" : "",
          {
            indexedCount: cached.length,
            legacyCount,
            pendingCount,
            cloudCount: null,
            syncError: String(error && error.message ? error.message : error)
          }
        );
      }
    }

    function bindManufacturingRecordEdit(record) {
      const prepDate = document.getElementById("editRecordPrepDate");
      const date = document.getElementById("editRecordDate");
      const packageCount = document.getElementById("editRecordPackageCount");
      const herbStandardPackageCount = document.getElementById("editRecordHerbStandardPackageCount");
      const herbEventPieceCount = document.getElementById("editRecordHerbEventPieceCount");
      const packageCountLabel = document.getElementById("editRecordPackageCountLabel");
      const smokedCount = document.getElementById("editRecordSmokedCount");
      const unsmokedCount = document.getElementById("editRecordUnsmokedCount");
      const lossCount = document.getElementById("editRecordLossCount");
      const leftoverWeight = document.getElementById("editRecordLeftoverWeight");
      const memo = document.getElementById("editRecordMemo");
      const togeEnabled = document.getElementById("editRecordTogeAllocationEnabled");
      const togeFields = document.getElementById("editRecordTogeAllocationFields");
      const togeId = document.getElementById("editRecordTogeAllocationId");
      const togeGeneratedId = document.getElementById("editRecordTogeGeneratedId");
      const togePieceCount = document.getElementById("editRecordTogePieceCount");
      const preview = document.getElementById("recordEditPreview");
      const allocationValues = () => ({
        enabled: Boolean(togeEnabled && togeEnabled.checked),
        id: togeId ? (togeId.value === "__new__" ? togeGeneratedId.value : togeId.value) : "",
        pieceCount: togePieceCount ? togePieceCount.value : "0"
      });
      const renderPreview = () => {
        if (togeFields) togeFields.style.display = togeEnabled.checked ? "grid" : "none";
        const allocation = allocationValues();
        if (packageCountLabel) packageCountLabel.childNodes[0].nodeValue = `${record.packageCountLabel || "包装数"}\n`;
        const updated = recalculateManufacturingRecord(record, prepDate.value, date.value, packageCount ? packageCount.value : "", lossCount.value, leftoverWeight.value, memo.value, smokedCount ? smokedCount.value : "0", unsmokedCount ? unsmokedCount.value : "0", allocation.enabled, allocation.id, allocation.pieceCount, herbStandardPackageCount ? herbStandardPackageCount.value : "0", herbEventPieceCount ? herbEventPieceCount.value : "0");
        preview.innerHTML = manufacturingRecordReadHtml(updated, true);
        document.getElementById("recordDetailText").value = buildManufacturingRecordText(updated);
      };
      [prepDate, date, packageCount, herbStandardPackageCount, herbEventPieceCount, smokedCount, unsmokedCount, lossCount, leftoverWeight, memo, togeEnabled, togeId, togePieceCount].filter(Boolean).forEach((element) => element.addEventListener("input", renderPreview));
      [togeEnabled, togeId].filter(Boolean).forEach((element) => element.addEventListener("change", renderPreview));
      document.getElementById("recordEditCancel").addEventListener("click", () => showManufacturingRecordDetail(manufacturingRecordId(record)));
      const editSaveButton = document.getElementById("recordEditSave");
      let isSavingRecordEdit = false;
      editSaveButton.addEventListener("click", async () => {
        if (isSavingRecordEdit) return;
        if (!prepDate.value || !date.value) {
          showSaveToast("必須項目を入力してください。", "error");
          return;
        }
        isSavingRecordEdit = true;
        editSaveButton.disabled = true;
        try {
          const allocation = allocationValues();
          const updated = recalculateManufacturingRecord(record, prepDate.value, date.value, packageCount ? packageCount.value : "", lossCount.value, leftoverWeight.value, memo.value, smokedCount ? smokedCount.value : "0", unsmokedCount ? unsmokedCount.value : "0", allocation.enabled, allocation.id, allocation.pieceCount, herbStandardPackageCount ? herbStandardPackageCount.value : "0", herbEventPieceCount ? herbEventPieceCount.value : "0");
          const quantityChanged = manufacturingCountForRecord(updated) !== manufacturingCountForRecord(record)
            || Number(updated.herbStandardPackageCount || 0) !== Number(record.herbStandardPackageCount || 0)
            || Number(updated.herbEventPieceCount || 0) !== Number(record.herbEventPieceCount || 0)
            || Number(updated.togePieceCount || 0) !== Number(record.togePieceCount || 0)
            || Boolean(updated.togeAllocationEnabled) !== Boolean(record.togeAllocationEnabled);
          const missingHerbWeights = isCombinedHerbManufacturingRecord(updated) && (!Number.isFinite(Number(updated.herbStandardUnitWeightG)) || Number(updated.herbStandardUnitWeightG) <= 0 || !Number.isFinite(Number(updated.herbEventUnitWeightG)) || Number(updated.herbEventUnitWeightG) <= 0);
          const missingSingleWeight = !isCombinedHerbManufacturingRecord(updated) && (updated.savedUnitWeightG == null || !Number.isFinite(Number(updated.savedUnitWeightG)) || Number(updated.savedUnitWeightG) <= 0);
          if (quantityChanged && (missingHerbWeights || missingSingleWeight)) {
            showSaveToast("保存時基準重量がないため、完成数量を変更できません。", "error");
            return;
          }
          const allocationError = validateTogeAllocation(updated, manufacturingRecordId(record));
          if (allocationError) {
            showSaveToast(allocationError, "error");
            return;
          }
          const syncResult = await saveManufacturingRecordOfflineFirst(updated);
          const records = loadManufacturingRecords();
          const index = records.findIndex((item) => manufacturingRecordId(item) === manufacturingRecordId(record));
          if (index >= 0) records[index] = updated;
          saveManufacturingRecords(records);
          showManufacturingRecordDetail(manufacturingRecordId(updated), false, "更新しました");
          showSaveToast(syncResult.synced ? "保存しました。" : "端末に保存しました。クラウド同期は保留中です。");
        } catch (error) {
          showSaveToast("保存できませんでした。もう一度お試しください。", "error");
        } finally {
          isSavingRecordEdit = false;
          editSaveButton.disabled = false;
        }
      });
      renderPreview();
    }

    function recalculateManufacturingRecord(record, prepDate, date, countValue, lossCount, leftoverWeight, memo, smokedValue = "0", unsmokedValue = "0", togeEnabledValue = Boolean(record.togeAllocationEnabled), togeIdValue = record.togeAllocationId || "", togePieceValue = record.togePieceCount || 0, herbStandardValue = record.herbStandardPackageCount || 0, herbEventValue = record.herbEventPieceCount || 0) {
      const isGibier = isGibierManufacturingRecord(record);
      const isCombinedHerb = isCombinedHerbManufacturingRecord(record);
      const theoreticalFinishedWeight = Number(record.theoreticalFinishedWeight || 0);
      const unitWeight = inferSavedUnitWeight(record, record.actualFinishedWeightG != null ? record.actualFinishedWeightG : record.finishedWeight);
      const gibierMetrics = calculateGibierProductionMetrics(smokedValue, unsmokedValue, theoreticalFinishedWeight, unitWeight);
      const smokedCount = isGibier ? gibierMetrics.smokedCount : Number(record.smokedCount || 0);
      const unsmokedCount = isGibier ? gibierMetrics.unsmokedCount : Number(record.unsmokedCount || 0);
      const count = isGibier ? gibierMetrics.completedCount : Number(countValue || 0);
      const herbStandardPackageCount = isCombinedHerb ? Number(herbStandardValue || 0) : null;
      const herbEventPieceCount = isCombinedHerb ? Number(herbEventValue || 0) : null;
      const togeComponentType = togeComponentTypeForRecord(record);
      const togeAllocationEnabled = Boolean(togeComponentType && togeEnabledValue);
      const togePieceCount = togeAllocationEnabled ? Number(togePieceValue || 0) : 0;
      const togeAllocatedWeight = togeAllocationEnabled && Number.isFinite(togePieceCount) ? togePieceCount * 35 : 0;
      const originalCount = manufacturingCountForRecord(record);
      const quantitiesChanged = isCombinedHerb
        ? herbStandardPackageCount !== Number(record.herbStandardPackageCount || 0) || herbEventPieceCount !== Number(record.herbEventPieceCount || 0) || togeAllocationEnabled !== Boolean(record.togeAllocationEnabled) || togePieceCount !== Number(record.togePieceCount || 0)
        : isGibier
        ? smokedCount !== Number(record.smokedCount || 0) || unsmokedCount !== Number(record.unsmokedCount || 0)
        : count !== originalCount || togeAllocationEnabled !== Boolean(record.togeAllocationEnabled) || togePieceCount !== Number(record.togePieceCount || 0);
      const storedFinishedWeight = record.actualFinishedWeightG != null ? record.actualFinishedWeightG : record.finishedWeight;
      const storedYieldRate = record.actualYieldPercent != null ? record.actualYieldPercent : record.yieldRate;
      const herbStandardUnitWeightG = isCombinedHerb ? Number(record.herbStandardUnitWeightG) : null;
      const herbEventUnitWeightG = isCombinedHerb ? Number(record.herbEventUnitWeightG) : null;
      const herbStandardFinishedWeightG = isCombinedHerb && Number.isFinite(herbStandardUnitWeightG) && herbStandardUnitWeightG > 0 ? herbStandardPackageCount * herbStandardUnitWeightG : null;
      const herbEventFinishedWeightG = isCombinedHerb && Number.isFinite(herbEventUnitWeightG) && herbEventUnitWeightG > 0 ? herbEventPieceCount * herbEventUnitWeightG : null;
      const baseFinishedWeight = isCombinedHerb
        ? (herbStandardFinishedWeightG == null || herbEventFinishedWeightG == null ? null : herbStandardFinishedWeightG + herbEventFinishedWeightG)
        : (unitWeight == null ? null : count * unitWeight);
      const recalculatedFinishedWeight = baseFinishedWeight == null ? null : baseFinishedWeight + togeAllocatedWeight;
      const finishedWeight = !quantitiesChanged && storedFinishedWeight != null ? Number(storedFinishedWeight) : recalculatedFinishedWeight;
      const yieldRate = !quantitiesChanged && storedYieldRate != null
        ? Number(storedYieldRate)
        : (finishedWeight == null || theoreticalFinishedWeight <= 0 ? null : finishedWeight / theoreticalFinishedWeight * 100);
      return {
        ...record,
        prepDate,
        date,
        lot: generateLotFromExistingRecord(record, date),
        packageCount: isCombinedHerb || record.packagingUnit === "本" ? "" : countValue,
        completedCount: isCombinedHerb ? "" : (record.packagingUnit === "本" ? String(count) : (record.completedCount || "")),
        herbStandardPackageCount,
        herbEventPieceCount,
        herbStandardUnitWeightG,
        herbEventUnitWeightG,
        herbStandardFinishedWeightG,
        herbEventFinishedWeightG,
        smokedCount,
        unsmokedCount,
        lossCount,
        leftoverWeight,
        memo,
        togeAllocationEnabled,
        togeAllocationId: togeAllocationEnabled ? togeIdValue : "",
        togeAllocationUuid: togeAllocationEnabled ? togeIdValue : "",
        togePieceCount,
        togeAllocatedWeight,
        togeComponentType: togeAllocationEnabled ? togeComponentType : "",
        finishedWeight,
        yieldRate,
        savedUnitWeightG: unitWeight,
        actualFinishedWeightG: finishedWeight,
        actualYieldPercent: yieldRate,
        updatedAt: new Date().toISOString()
      };
    }

    function generateLotFromExistingRecord(record, date) {
      const code = record.recipeCode || recipeCodeFromRecord(record);
      const datePart = (date || todayString()).replace(/-/g, "");
      const categoryCode = record.category === "自社レシピ" ? "JI" : "IT";
      const base = `${datePart}-${categoryCode}-${code}`;
      if (String(record.lot || "").startsWith(`${base}-`)) return record.lot;
      const count = loadManufacturingRecords().filter((item) => manufacturingRecordId(item) !== manufacturingRecordId(record) && String(item.lot || "").startsWith(base)).length + 1;
      return `${base}-${String(count).padStart(2, "0")}`;
    }

    function recipeCodeFromRecord(record) {
      if (record.recipeCode === "ADDITIVE-FREE-ARABIKI" || record.recipeKind === "fixed-own" || record.recipeName === "無添加あらびき") return "ADDITIVE-FREE-ARABIKI";
      if (record.packagingKey === "arabiki" || record.recipeName === "あらびき") return "ARABIKI";
      if (record.packagingKey === "cheese" || record.recipeName === "チーズ") return "CHEESE";
      if (record.packagingKey === "herbProduct") return "HERB-P";
      if (record.packagingKey === "herbEvent") return "HERB-E";
      if (String(record.recipeName || "").includes("ハーブ")) return "HERB";
      if (record.packagingKey === "chorizo" || record.recipeName === "チョリソー") return "CHORIZO";
      if (String(record.recipeName || "").includes("山小屋")) return "YAMAGOYA";
      if (String(record.recipeName || "").includes("ジビエ")) return "GIBIER";
      if (String(record.recipeName || "").includes("峠")) return "TOUGE";
      return "RECIPE";
    }

    async function deleteManufacturingRecord(recordId) {

      try {

        const index = records.findIndex((record) => manufacturingRecordId(record) === recordId);
        if (index < 0) throw new Error("製造記録が見つかりません。");
        const deletedRecord = { ...records[index], status: "deleted", updatedAt: new Date().toISOString() };
        await saveManufacturingRecordOfflineFirst(deletedRecord);
        records[index] = deletedRecord;
        saveManufacturingRecords(records);
        showManufacturingRecordHistory(showManufacturingRecordTop, "削除しました");
      } catch (error) {

    function buildManufacturingRecordsCsv(records) {
      const rows = records.map((record) => {
        const completedCount = record.completedCount;
        const finishedWeight = record.actualFinishedWeightG != null ? record.actualFinishedWeightG : record.finishedWeight;
        const yieldRate = record.actualYieldPercent != null ? record.actualYieldPercent : record.yieldRate;
        const componentType = togeComponentTypeForRecord(record);
        const productPackageCount = isCombinedHerbManufacturingRecord(record)
          ? record.herbStandardPackageCount
          : (componentType === "arabiki" ? record.packageCount : "");
        const eventPieceCount = isCombinedHerbManufacturingRecord(record) ? record.herbEventPieceCount : "";
        const togePieceCount = record.togeAllocationEnabled ? record.togePieceCount : "";
        const togeUsedWeight = record.togeAllocationEnabled ? record.togeAllocatedWeight : "";
        return [
        record.prepDate, record.date, record.category, record.recipeName || record.product, record.lot,
        csvNumber(record.meat6mm), csvNumber(record.meat3mm), csvNumber(record.meatTotal), csvNumber(record.waterAmount),
        csvNumber(record.emulsionWeight), csvNumber(record.totalWeight), record.packagingUnit,
        record.packageCount || "", completedCount || "", csvNumber(record.smokedCount || 0), csvNumber(record.unsmokedCount || 0), record.lossCount, csvNumber(record.leftoverWeight || 0),
        csvNullableNumber(finishedWeight), csvNullableNumber(yieldRate), record.memo,
        productPackageCount === "" || productPackageCount == null ? "" : csvNumber(productPackageCount),
        eventPieceCount === "" || eventPieceCount == null ? "" : csvNumber(eventPieceCount),
        togePieceCount === "" || togePieceCount == null ? "" : csvNumber(togePieceCount),
        togeUsedWeight === "" || togeUsedWeight == null ? "" : csvNumber(togeUsedWeight)
        ];
      });
      return [MANUFACTURING_RECORD_CSV_HEADERS, ...rows].map((row) => row.map(csvCell).join(",")).join("\r\n");
    }

    function manufacturingCsvFileName(records) {
      const first = records[0] || {};
      const datePart = String(first.date || todayString()).replace(/-/g, "");
      const recipePart = String(first.recipeName || first.product || "全件").replace(/[\\/:*?"<>|\s]/g, "_");
      return `製造記録_${datePart}_${recipePart}.csv`;
    }

    function manufacturingCsvBlob(records) {
      return new Blob(["\ufeff", buildManufacturingRecordsCsv(records)], { type: "text/csv;charset=utf-8" });
    }

    function downloadManufacturingRecordsCsv(records) {
      const blob = manufacturingCsvBlob(records);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = manufacturingCsvFileName(records);
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
      const status = document.getElementById("recordCsvStatus");
      if (status) status.textContent = "CSVを保存しました。必要に応じてOneDriveの「製造管理 / CSV / 未取込」フォルダへ移動してください。";
    }

    async function shareManufacturingRecordsCsv(records) {
      const status = document.getElementById("recordCsvStatus");
      const fileName = manufacturingCsvFileName(records);
      const file = new File([manufacturingCsvBlob(records)], fileName, { type: "text/csv" });
      if (status) status.textContent = "共有画面が開きます。OneDriveの「製造管理 / CSV / 未取込」へ保存してください。";
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
          await navigator.share({ files: [file], title: "製造記録CSV", text: "OneDrive / 製造管理 / CSV / 未取込 へ保存してください。" });
        } else {
          downloadManufacturingRecordsCsv(records);
          if (status) status.textContent = "共有機能が使えないためCSVを保存しました。OneDriveの「製造管理 / CSV / 未取込」フォルダへ移動してください。";
        }
      } catch (error) {
        if (error && error.name === "AbortError") return;
        downloadManufacturingRecordsCsv(records);
        if (status) status.textContent = "共有保存できませんでした。CSVを保存後、OneDriveの「製造管理 / CSV / 未取込」フォルダへ移動してください。";
      }
    }

    function copyManufacturingRecordsCsv(records) {

    function csvCell(value) {
      const text = value == null ? "" : String(value);
      return `"${text.replace(/"/g, '""')}"`;
    }

    function csvNumber(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(1) : "0.0";
    }

    function csvNullableNumber(value) {
      if (value == null || value === "") return "";
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric.toFixed(1) : "";
    }

    function formatRecordNumber(value) {
      const numeric = Number(value);
      return formatNumber(Number.isFinite(numeric) ? numeric : 0);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

        const recipeNameForCalc = recipe.baseRecipeName || recipe.name;
        const rows = recipe.kind === "yamanoya" ? calculateYamanoya(meat) : calculateOwnRecipe(recipeNameForCalc, meat, emulsion, emulsionMode);
        const total = rows.reduce((sum, row) => sum + row.calculated, 0);
        const splitCount = splitSelect ? Number(splitSelect.value || 1) : 1;
        const splitLabel = splitLabelText(splitCount);
        const displayRows = splitRows(rows, splitCount);

      const productionDateInput = document.getElementById(`${prefix}-productionDate`);

          saveCalcButton.disabled = false;
        }
      });
      render();

    function calculateOwnRecipe(recipeName, meat, emulsion, emulsionMode = "自動計算") {
      const water = meat * 0.2;
      const meatWater = meat + water;
      const meatWaterEmulsion = meat + water + emulsion;
      const rows = [
        { name: "肉重量", group: "入力", calculated: meat },
        { name: "水", group: "肉重量×0.2", calculated: water },
        { name: "乳化生地", group: emulsionMode === "手入力" ? "手入力値をそのまま使用" : "（肉重量＋水）×0.2", calculated: emulsion },
        { name: "塩", group: "（肉重量＋水）×1.6%", calculated: meatWater * 0.016 }
      ];

      if (recipeName === "あらびき" || recipeName === "チーズ") {
        rows.push({ name: "ウインナーヘラマント", group: "（肉重量＋水＋乳化生地）×0.5%", calculated: meatWaterEmulsion * 0.005 });
      }

      if (recipeName === "ハーブ") {
        rows.push({ name: "ブラートブルストD", group: "（肉重量＋水＋乳化生地）×0.5%", calculated: meatWaterEmulsion * 0.005 });
      }

      rows.push(
        { name: "ヘラビンE", group: "（肉重量＋水）×0.3%", calculated: meatWater * 0.003 },
        { name: "ペルビナールHH", group: "（肉重量＋水）×0.1%", calculated: meatWater * 0.001 }
      );

      if (recipeName === "チーズ") {
        rows.push({ name: "チーズ", group: "（肉重量＋水＋乳化生地）×10%", calculated: meatWaterEmulsion * 0.10 });
      }

      if (recipeName === "ハーブ") {
        rows.push(
          { name: "マジョラム", group: "（肉重量＋水＋乳化生地）×0.1%", calculated: meatWaterEmulsion * 0.001 },
          { name: "バジル", group: "（肉重量＋水＋乳化生地）×0.05%", calculated: meatWaterEmulsion * 0.0005 },
          { name: "オレガノ", group: "（肉重量＋水＋乳化生地）×0.05%", calculated: meatWaterEmulsion * 0.0005 }
        );
      }

      if (recipeName === "チョリソー") {
        rows.push(
          { name: "チョリソースパイス", group: "（肉重量＋水＋乳化生地）×1.2%", calculated: meatWaterEmulsion * 0.012 },
          { name: "唐辛子", group: "（肉重量＋水＋乳化生地）×0.2%", calculated: meatWaterEmulsion * 0.002 }
        );
      }

      return rows;
    }

    function calculateYamanoya(meat) {
      const backFat = meat * 0.16;
      const water = (meat + backFat) * 0.2;
      const base = meat + backFat + water;
      return [
        { name: "肉重量", group: "入力", calculated: meat },
        { name: "背脂", group: "肉重量×16%", calculated: backFat },
        { name: "水", group: "（肉重量＋背脂）×0.2", calculated: water },
        { name: "塩", group: "（肉重量＋背脂＋水）×1.6%", calculated: base * 0.016 },
        { name: "スパイス", group: "（肉重量＋背脂＋水）×1.6%", calculated: base * 0.016 },
        { name: "ヘラビンE", group: "（肉重量＋背脂＋水）×0.3%", calculated: base * 0.003 },
        { name: "ペルビナールHH", group: "（肉重量＋背脂＋水）×0.1%", calculated: base * 0.001 }
      ];
    }

    function calculateGibier(deer, pork) {
      const meatTotal = deer + pork;
      const water = meatTotal * 0.2;
      const base = meatTotal + water;
      return [
        { name: "鹿肉重量", group: "入力 / ジビエセンターから支給", calculated: deer },
        { name: "豚ひき肉重量", group: "入力 / エーコープで仕入", calculated: pork },
        { name: "水", group: "（鹿肉＋豚ひき肉）×0.2", calculated: water },
        { name: "塩", group: "（鹿肉＋豚ひき肉＋水）×1.6%", calculated: base * 0.016 },
        { name: "ウインナーヘラマント", group: "（鹿肉＋豚ひき肉＋水）×0.5%", calculated: base * 0.005 },
        { name: "ヘラビンE", group: "（鹿肉＋豚ひき肉＋水）×0.3%", calculated: base * 0.003 },
        { name: "ペルビナールHH", group: "（鹿肉＋豚ひき肉＋水）×0.1%", calculated: base * 0.001 }
      ];
    }

    function splitLabelText(splitCount) {
      if (splitCount === 2) return "2等分";
      if (splitCount === 3) return "3等分";

      return "分割なし";
    }

      return rows.map((row) => ({

      }));
    }

    function buildCopyText(title, rows, total, unit = "g", productionDate = todayString(), splitLabel = null, meatInfo = null, productionDateFirst = false) {
      const lines = productionDateFirst ? [`製造日：${productionDate}`, title] : [title, `製造日：${productionDate}`];
      if (splitLabel) {
        lines.push(`表示：${splitLabel}`);
        if (splitLabel !== "分割なし") lines.push("※以下は1回分あたりの分量");
      }
      lines.push("");
      if (meatInfo) {
        lines.push(`6mm肉重量：${formatNumber(meatInfo.meat6mm)}${unit}`);
        lines.push(`3mm肉重量：${formatNumber(meatInfo.meat3mm)}${unit}`);
        lines.push(`肉重量合計：${formatNumber(meatInfo.meatTotal)}${unit}`);
        lines.push("");
      }
      rows.forEach((row) => lines.push(`${row.name}: ${formatNumber(row.calculated)}${unit}`));
      lines.push("", `合計: ${formatNumber(total)}${unit}`);
      return lines.join("\n");
    }

      const productionDate = document.getElementById("baconProductionDate");
      const weight = document.getElementById("baconWeight");
      const start = document.getElementById("baconStart");
      const result = document.getElementById("baconResult");
      const text = document.getElementById("baconText");
      const status = document.getElementById("baconStatus");
      const render = () => {
        const pork = Math.max(Number(weight.value || 0), 0);
        const rows = [
          { name: "豚バラ肉重量", group: "入力", calculated: pork },
          { name: "塩", group: "豚バラ肉重量×2.5%", calculated: pork * 0.025 },
          { name: "三温糖", group: "塩×25%", calculated: pork * 0.025 * 0.25 }
        ];
        const endDate = addDays(start.value, 7);
        result.innerHTML = tableHtml(rows, rows.reduce((sum, row) => sum + row.calculated, 0));
        text.value = `${buildCopyText("ベーコン", rows, rows.reduce((sum, row) => sum + row.calculated, 0), "g", productionDate.value)}\n塩漬け開始日: ${start.value}\n塩漬け終了予定: ${endDate}`;
      };
      productionDate.addEventListener("input", render);
      weight.addEventListener("input", render);
      start.addEventListener("input", render);
      document.getElementById("baconCopy").addEventListener("click", () => copyToClipboard(text.value, status));
      render();
    }

    function showProsciutto() {
      setHeader("生ハム", "塩・熟成完了予定", true, () => showCategory("curing"));
      app.innerHTML = `
        <section class="section">
          <div class="field-row">
            <label>製造日
              <input id="prosciuttoProductionDate" type="date" value="${todayString()}">
            </label>
          </div>
          <div class="product-name">生ハム</div>
          <div class="field-row">
            <label>骨付きもも肉重量(g)
              <input id="prosciuttoWeight" type="number" min="0" step="1" value="1000">
            </label>
            <label>仕込み日
              <input id="prosciuttoStart" type="date" value="${todayString()}">
            </label>
            <label>熟成期間
              <select id="prosciuttoMonths">
                <option value="12">12か月</option>
                <option value="18">18か月</option>
              </select>
            </label>
            <button id="prosciuttoCopy" class="primary" type="button">GoodNotes用コピー</button>
          </div>
          <div id="prosciuttoResult"></div>
          <div class="copy-area">
            <textarea id="prosciuttoText" readonly></textarea>
            <div id="prosciuttoStatus" class="status"></div>
          </div>
        </section>
      `;
      const productionDate = document.getElementById("prosciuttoProductionDate");
      const weight = document.getElementById("prosciuttoWeight");
      const start = document.getElementById("prosciuttoStart");
      const months = document.getElementById("prosciuttoMonths");
      const result = document.getElementById("prosciuttoResult");
      const text = document.getElementById("prosciuttoText");
      const status = document.getElementById("prosciuttoStatus");
      const render = () => {
        const pork = Math.max(Number(weight.value || 0), 0);
        const rows = [
          { name: "骨付きもも肉重量", group: "入力", calculated: pork },
          { name: "塩", group: "骨付きもも肉重量×10%", calculated: pork * 0.10 }
        ];
        const endDate = addMonths(start.value, months.value);
        result.innerHTML = tableHtml(rows, rows.reduce((sum, row) => sum + row.calculated, 0));
        text.value = `${buildCopyText("生ハム", rows, rows.reduce((sum, row) => sum + row.calculated, 0), "g", productionDate.value)}\n仕込み日: ${start.value}\n熟成期間: ${months.value}か月\n熟成完了予定日: ${endDate}`;
      };
      productionDate.addEventListener("input", render);
      weight.addEventListener("input", render);
      start.addEventListener("input", render);
      months.addEventListener("change", render);
      document.getElementById("prosciuttoCopy").addEventListener("click", () => copyToClipboard(text.value, status));
      render();
    }

    function showEmulsion() {
      setHeader("乳化生地", "豚肉のみ / 豚肉＋豚脂", true, showHome);
      app.innerHTML = `
        <section class="section">
          <div class="field-row">
            <label>製造日
              <input id="emulsionProductionDate" type="date" value="${todayString()}">
            </label>
          </div>
          <div class="product-name">乳化生地</div>
          <div class="field-row">
            <label>方式
              <select id="emulsionMode">
                <option value="porkOnly">豚肉のみ</option>
                <option value="porkFat">豚肉＋豚脂</option>
              </select>
            </label>
            <label id="emulsionWeightLabel">肉重量(g)
              <input id="emulsionWeight" type="number" min="0" step="1" value="1000">
            </label>
            <button id="emulsionCopy" class="primary" type="button">計算結果をコピー</button>
          </div>
          <div id="emulsionResult"></div>
          <div class="copy-area">
            <textarea id="emulsionText" readonly></textarea>
            <div id="emulsionStatus" class="status"></div>
          </div>
        </section>
      `;
      const productionDate = document.getElementById("emulsionProductionDate");
      const mode = document.getElementById("emulsionMode");
      const weight = document.getElementById("emulsionWeight");
      const label = document.getElementById("emulsionWeightLabel");
      const result = document.getElementById("emulsionResult");
      const text = document.getElementById("emulsionText");
      const status = document.getElementById("emulsionStatus");
      const render = () => {
        const inputWeight = Math.max(Number(weight.value || 0), 0);
        label.childNodes[0].nodeValue = mode.value === "porkOnly" ? "肉重量(g)\n" : "豚肉＋豚脂重量(g)\n";
        const rows = mode.value === "porkOnly" ? calculateEmulsionPorkOnly(inputWeight) : calculateEmulsionPorkFat(inputWeight);
        const total = rows.reduce((sum, row) => sum + row.calculated, 0);
        result.innerHTML = tableHtml(rows, total);
        text.value = buildCopyText(`乳化生地 ${mode.value === "porkOnly" ? "豚肉のみ" : "豚肉＋豚脂"}`, rows, total, "g", productionDate.value);
      };
      productionDate.addEventListener("input", render);
      mode.addEventListener("change", render);
      weight.addEventListener("input", render);
      document.getElementById("emulsionCopy").addEventListener("click", () => copyToClipboard(text.value, status));
      render();
    }

    function calculateEmulsionPorkOnly(meat) {
      const porkFat = meat / 3;
      const ice = meat / 3;
      const base = meat + porkFat + ice;
      return [
        { name: "肉重量", group: "入力", calculated: meat },
        { name: "豚脂", group: "肉重量÷3", calculated: porkFat },
        { name: "氷", group: "肉重量÷3", calculated: ice },
        { name: "塩", group: "（肉重量＋豚脂＋氷）×1.6%", calculated: base * 0.016 },
        { name: "ヘラビンE", group: "（肉重量＋豚脂＋氷）×0.3%", calculated: base * 0.003 },
        { name: "ペルビナールHH", group: "（肉重量＋豚脂＋氷）×0.1%", calculated: base * 0.001 }
      ];
    }

    function calculateEmulsionPorkFat(weight) {
      const ice = weight * 0.25;
      const base = weight + ice;
      return [
        { name: "豚肉＋豚脂重量", group: "入力 / 完成比率80%", calculated: weight },
        { name: "氷", group: "（豚肉＋豚脂）×0.25 / 完成比率20%", calculated: ice },
        { name: "塩", group: "（豚肉＋豚脂＋氷）×1.6%", calculated: base * 0.016 },
        { name: "ヘラビンE", group: "（豚肉＋豚脂＋氷）×0.3%", calculated: base * 0.003 },
        { name: "ペルビナールHH", group: "（豚肉＋豚脂＋氷）×0.1%", calculated: base * 0.001 }
      ];
    }

    function showTemporaryStatus(statusElement, message, type = "notice") {
      if (!statusElement) return;
      statusElement.textContent = message;
      statusElement.classList.remove("notice", "error");
      statusElement.classList.add(type === "error" ? "error" : "notice");
      clearTimeout(statusElement.dataset.timerId);
      const timerId = setTimeout(() => {
        statusElement.textContent = "";
        statusElement.classList.remove("notice", "error");
        delete statusElement.dataset.timerId;
      }, 2500);
      statusElement.dataset.timerId = String(timerId);
    }

    let saveToastTimerId = null;

    function showSaveToast(message, type = "notice") {
      let toast = document.getElementById("recipe-save-toast");
      if (!toast) {
        toast = document.createElement("div");
        toast.id = "recipe-save-toast";
        toast.className = "save-toast";
        toast.setAttribute("role", "status");
        toast.setAttribute("aria-live", "polite");
        document.body.appendChild(toast);
      }

      if (saveToastTimerId !== null) clearTimeout(saveToastTimerId);
      toast.textContent = message;
      toast.classList.toggle("error", type === "error");
      toast.classList.remove("visible");
      void toast.offsetWidth;
      toast.classList.add("visible");

      saveToastTimerId = setTimeout(() => {
        toast.classList.remove("visible");
        saveToastTimerId = null;
      }, 2000);
    }

    async function copyToClipboard(text, statusElement) {
      if (!statusElement) return;
      try {
        await navigator.clipboard.writeText(text);
        statusElement.textContent = "コピーしました";
      } catch (error) {
        statusElement.textContent = "コピーできない場合は、下の文字を選択してコピーしてください";
      }
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") persistCurrentScreenState();
    });
    window.addEventListener("beforeunload", persistCurrentScreenState);

    initApp();
  </script>
</body>
</html>
