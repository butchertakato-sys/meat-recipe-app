<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>食肉加工 配合・製造管理</title>
  <style>
    :root {
      --bg: #ffffff;
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #5f6b7a;
      --line: #e5e7eb;
      --brand: #14532d;
      --brand-dark: #123c24;
      --accent: #9f2f22;
      --soft: #f5f5f5;
      --warn: #fff7ed;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      --radius: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-size: 19px;
      line-height: 1.55;
      writing-mode: horizontal-tb;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: var(--radius);
      cursor: pointer;
      touch-action: manipulation;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 56px;
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      background: #fff;
      color: var(--ink);
      font-size: 20px;
    }

    textarea {
      min-height: 160px;
      resize: vertical;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      align-items: center;
      width: min(700px, 100%);
      margin: 0 auto;
      padding: calc(16px + env(safe-area-inset-top)) 16px 14px;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .topbar.has-back {
      grid-template-columns: 56px 1fr;
    }

    .back {
      display: none;
      background: var(--panel);
      border: 2px solid var(--line);
      color: var(--ink);
      font-size: 26px;
      font-weight: 800;
    }

    .topbar.has-back .back {
      display: block;
    }

    .title {
      min-width: 0;
      writing-mode: horizontal-tb;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1.2;
      letter-spacing: 0;
      white-space: normal;
    }

    .title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    main {
      width: min(700px, 100%);
      margin: 0 auto;
      padding: 18px 16px calc(36px + env(safe-area-inset-bottom));
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .menu-grid {
      grid-template-columns: 1fr;
    }

    .home-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: stretch;
    }

    .menu-button {
      display: flex;
      min-height: 88px;
      height: 100%;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 6px;
      padding: 18px 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      text-align: left;
    }

    .menu-button strong {
      font-size: 23px;
      line-height: 1.25;
    }

    .menu-button span {
      color: var(--muted);
      font-size: 16px;
    }

    .primary {
      background: var(--brand);
      color: #fff;
      font-weight: 800;
    }

    .secondary {
      background: var(--panel);
      border: 2px solid var(--line);
      color: var(--ink);
      font-weight: 700;
    }

    .section {
      margin-bottom: 18px;
      padding: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-x: hidden;
    }

    .section h2,
    .section h3 {
      margin: 0 0 12px;
      line-height: 1.25;
    }

    .section h2 {
      font-size: 26px;
    }

    .section h3 {
      font-size: 22px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      align-items: end;
      margin-bottom: 12px;
    }

    .record-save {
      min-height: 64px;
      margin-top: 4px;
    }

    .record-other > summary {
      display: flex;
      align-items: center;
      min-height: 60px;
      padding: 14px 16px;
      border: 2px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      list-style: none;
      touch-action: manipulation;
    }

    .record-other > summary::-webkit-details-marker {
      display: none;
    }

    .record-other > summary:focus-visible {
      outline: 3px solid var(--brand);
      outline-offset: 3px;
    }

    .record-other .record-other-close,
    .record-other[open] .record-other-open {
      display: none;
    }

    .record-other[open] .record-other-close {
      display: inline;
    }

    .record-other[open] > summary {
      margin-bottom: 14px;
    }

    .record-basic-info {
      padding: 12px 16px;
      margin-bottom: 10px;
    }

    .record-basic-info h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .record-basic-info label {
      font-size: 17px;
      gap: 4px;
    }

    .record-basic-info .product-name {
      font-size: 20px;
      margin: 0;
    }

    .record-basic-info .record-basic-dates {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .record-basic-info input {
      min-width: 0;
      min-height: 48px;
      padding: 8px;
      font-size: 18px;
    }

    .record-primary-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 14px;
      align-items: end;
      margin-bottom: 14px;
    }

    .radio-group {
      display: grid;
      gap: 8px;
      padding: 10px 0;
    }

    .radio-option {
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 2px solid var(--line);
      border-radius: var(--radius);
      color: var(--ink);
      font-weight: 800;
    }

    .radio-option input {
      width: 24px;
      min-height: 24px;
      height: 24px;
      margin: 0;
      padding: 0;
    }

    .toge-allocation-checkbox {
      width: 56px;
      min-height: 56px;
      height: 56px;
      flex: 0 0 56px;
      margin: 0 -22.4px 0 0;
      transform: scale(0.6);
      transform-origin: left center;
      vertical-align: middle;
    }

    .toge-allocation-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      min-height: 56px;
      cursor: pointer;
      white-space: nowrap;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-weight: 700;
    }

    .result-box {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      padding: 16px;
      background: var(--soft);
      border-radius: var(--radius);
    }

    .meat-info-box {
      border: 2px solid #9bbcff;
      background: #f8fbff;
    }

    .result-subtitle {
      color: #1d4ed8;
      font-size: 18px;
      font-weight: 900;
    }

    .meat-info-box .result-row:last-child {
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px dashed #8aa3c7;
    }

    .result-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 12px;
      align-items: baseline;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .result-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .result-name {
      min-width: 0;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .result-formula {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 14px;
    }

    .result-value {
      font-size: 25px;
      font-weight: 900;
      white-space: nowrap;
    }

    .product-name {
      margin: 2px 0 16px;
      padding: 14px 16px;
      background: var(--soft);
      border-radius: var(--radius);
      font-size: 24px;
      font-weight: 900;
    }

    .note {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
    }

    .tabbar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab {
      min-height: 54px;
      background: #fff;
      border: 2px solid var(--line);
      color: var(--ink);
      font-weight: 800;
    }

    .tab.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    details {
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      overflow: hidden;
    }

    summary {
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    details .details-body {
      padding: 0 14px 14px;
    }

    .spec-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .spec-list li {
      padding: 12px;
      background: var(--soft);
      border-radius: var(--radius);
    }

    .copy-area {
      display: grid;
      gap: 10px;
      margin-top: 12px;
    }

    .status {
      min-height: 28px;
      color: var(--brand-dark);
      font-weight: 800;
    }

    .status.notice {
      min-height: auto;
      padding: 10px 12px;
      background: #eaf4ff;
      border: 1px solid #b8d7ff;
      border-radius: 12px;
    }

    .status.error {
      min-height: auto;
      padding: 10px 12px;
      background: var(--warn);
      border: 1px solid #ffd0c2;
      border-radius: 12px;
    }

    .save-toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      z-index: 1000;
      width: max-content;
      max-width: calc(100% - 32px);
      padding: 12px 20px;
      border-radius: 999px;
      background: var(--brand-dark);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.2);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .save-toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .save-toast.error {
      background: var(--accent);
    }

    .empty {
      padding: 20px;
      background: var(--warn);
      border-radius: var(--radius);
      font-weight: 700;
    }

    .record-summary {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 16px;
    }

    .packaging-standard {
      display: grid;
      gap: 4px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      font-size: 16px;
    }

    .packaging-active-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      width: fit-content;
    }

    .packaging-active-checkbox {
      width: 28px;
      min-height: 28px;
      height: 28px;
      margin: 0;
    }

    .record-actions {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    @media (max-width: 620px) {
      body {
        font-size: 18px;
      }

      main {
        padding-left: 10px;
        padding-right: 10px;
      }

      .section {
        padding: 16px;
      }

      .menu-button {
        min-height: 82px;
      }

      .home-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header id="topbar" class="topbar">
      <button id="backButton" class="back" type="button" aria-label="戻る">←</button>
      <div class="title">
        <h1 id="screenTitle">食肉加工 配合・製造管理</h1>
        <p id="screenSubtitle">単体HTML / iPad・iPhone・Windows共通</p>
      </div>
    </header>
    <main id="app"></main>
  </div>

  <script src="supabase/supabase-config.js"></script>

    function todayString() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function addDays(dateString, days) {
      const date = new Date(dateString + "T00:00:00");
      date.setDate(date.getDate() + Number(days));
      return date.toISOString().slice(0, 10);
    }

    function addMonths(dateString, months) {
      const date = new Date(dateString + "T00:00:00");

    function formatNumber(value, digits = 1) {

        maximumFractionDigits: digits
      });

    function readStorageArray(primaryKey, legacyKey) {
      try {
        let rawValue = localStorage.getItem(primaryKey);
        if (rawValue == null && legacyKey) {
          rawValue = localStorage.getItem(legacyKey);
          if (rawValue != null) localStorage.setItem(primaryKey, rawValue);
        }
        const parsed = JSON.parse(rawValue || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {
        return [];
      }
    }

    function readLegacyStorageArray(legacyKey) {
      if (!legacyKey) return [];

        return Array.isArray(parsed) ? parsed : [];
      } catch (error) {

      }
    }

    function amountFromRows(rows, name) {
      const row = Array.isArray(rows) ? rows.find((item) => item.name === name) : null;
      return row ? Number(row.calculated || 0) : 0;
    }

    function sumRows(rows) {
      return Array.isArray(rows) ? rows.reduce((sum, row) => sum + Number(row.calculated || 0), 0) : 0;
    }

    function isMeatInputRow(row) {
      return ["肉重量", "鹿肉重量", "豚ひき肉重量"].includes(row.name);
    }

    function sumIngredientRows(rows) {
      return Array.isArray(rows)
        ? rows.filter((row) => !isMeatInputRow(row)).reduce((sum, row) => sum + Number(row.calculated || 0), 0)
        : 0;
    }

    function enrichSavedRecipeCalculation(record) {
      const rows = Array.isArray(record.rows) ? record.rows : [];
      const meatTotal = Number(record.meatTotal || 0);
      const emulsionWeight = Number(record.emulsionWeight || 0);
      const recipeMaterialTotal = Number(record.total != null ? record.total : sumRows(rows));
      const ingredientTotal = sumIngredientRows(rows);
      const waterAmount = Number(amountFromRows(rows, "水"));
      const totalWeight = meatTotal + ingredientTotal;
      const otherMaterialTotal = Math.max(ingredientTotal - waterAmount - emulsionWeight, 0);
      const theoreticalFinishedWeight = totalWeight;
      const packagingSpec = record.packagingKey ? ownPackagingSpecs[record.packagingKey] : null;
      return {
        ...record,
        waterAmount,
        emulsionWeight,
        otherMaterialTotal,
        total: recipeMaterialTotal,
        totalWeight,
        theoreticalFinishedWeight,
        packagingUnit: record.packagingUnit || (packagingSpec ? packagingSpec.unit : ""),
        unitWeight: record.unitWeight != null ? record.unitWeight : (packagingSpec ? packagingSpec.unitWeight : null),
        unitPieces: record.unitPieces != null ? record.unitPieces : (packagingSpec ? packagingSpec.unitPieces : null),
        updatedAt: record.updatedAt || record.savedAt || record.createdAt || ""
      };
    }

    function yieldDisplayText(record) {
      const actualYield = record.actualYieldPercent != null ? record.actualYieldPercent : record.yieldRate;
      return actualYield == null ? "計算不可" : `${formatRecordNumber(actualYield)}%`;
    }

    function manufacturingCountForRecord(record) {
      if (isGibierManufacturingRecord(record)) return Number(record.completedCount || 0);
      return Number(record.packagingUnit === "本" ? record.completedCount : record.packageCount) || 0;
    }

    function inferSavedUnitWeight(record, actualFinishedWeight) {
      const stored = record.savedUnitWeightG != null ? record.savedUnitWeightG : (record.unitWeight != null ? record.unitWeight : record.packWeight);
      if (stored != null && stored !== "" && Number.isFinite(Number(stored)) && Number(stored) > 0) return Number(stored);
      const count = manufacturingCountForRecord(record);
      const allocatedWeight = Number(record.togeAllocatedWeight || 0);
      const baseWeight = actualFinishedWeight == null ? null : Number(actualFinishedWeight) - allocatedWeight;
      return count > 0 && baseWeight != null && Number.isFinite(baseWeight) && baseWeight > 0 ? baseWeight / count : null;
    }

    function isGibierManufacturingRecord(record) {
      return Boolean(record) && (
        record.recipeId === "client:gibier" ||
        record.recipeKind === "gibier" ||
        String(record.recipeName || record.product || "").includes("ジビエセンター")
      );
    }

    function calculateGibierProductionMetrics(smokedValue, unsmokedValue, theoreticalValue, unitWeightValue = 70) {
      const smokedCount = Math.max(Math.trunc(Number(smokedValue) || 0), 0);
      const unsmokedCount = Math.max(Math.trunc(Number(unsmokedValue) || 0), 0);
      const completedCount = smokedCount + unsmokedCount;
      const unitWeight = Number(unitWeightValue);
      const actualCompletedWeight = Number.isFinite(unitWeight) && unitWeight > 0 ? completedCount * unitWeight : null;
      const theoreticalWeight = Number(theoreticalValue) || 0;
      const yieldRate = actualCompletedWeight != null && theoreticalWeight > 0 ? actualCompletedWeight / theoreticalWeight * 100 : null;
      return { smokedCount, unsmokedCount, completedCount, actualCompletedWeight, yieldRate };
    }

    function initializeManufacturingSync() {
      if (!window.MeatProductionSync) return Promise.reject(new Error("端末保存機能を読み込めません。"));
      if (!manufacturingSyncInitialization) {

    let masterDataInitialization = null;

    const SUPABASE_PRODUCT_TO_LEGACY_ID = Object.freeze({
      ARABIKI: "PROD_ARABIKI",
      ADDITIVE_FREE_ARABIKI: "PROD_ADDITIVE_FREE_ARABIKI",
      HERB: "PROD_HERB",
      CHEESE: "PROD_CHEESE",
      CHORIZO: "PROD_CHORIZO",

      GIBIER_CENTER: "PROD_GIBIER_CENTER",

      ZANZATEI: "PROD_ZANZATEI"
    });

    function legacyPackagingName(internalCode) {
      return internalCode === "HERB_EVENT" ? "イベント" : "通常";
    }

    function applySupabaseMasterData(data) {
      if (!data || !Array.isArray(data.packagingMasters) || !Array.isArray(data.packagingVersions)) return false;
      const productById = new Map((data.products || []).map((product) => [product.id, product]));
      const currentVersionByMasterId = new Map(data.packagingVersions.map((version) => [version.packaging_master_id, version]));
      const now = new Date().toISOString();
      const records = data.packagingMasters.map((master, index) => {
        const product = productById.get(master.product_id);
        const version = currentVersionByMasterId.get(master.id);
        const productId = product ? SUPABASE_PRODUCT_TO_LEGACY_ID[product.internal_code] : "";
        if (!productId || !version) return null;
        const unitWeightG = Number(version.unit_weight_g);
        const packageWeightG = version.package_weight_g == null ? null : Number(version.package_weight_g);
        const fixedPieces = version.units_per_package == null ? null : Number(version.units_per_package);
        const minPieces = version.min_units_per_package == null ? null : Number(version.min_units_per_package);
        const maxPieces = version.max_units_per_package == null ? null : Number(version.max_units_per_package);
        return {
          packagingId: master.id,
          packagingVersionId: version.id,
          packagingInternalCode: master.internal_code,
          productId,
          supabaseProductId: master.product_id,
          packagingName: legacyPackagingName(master.internal_code),
          quantityPerPackage: fixedPieces != null ? fixedPieces : minPieces,
          minQuantityPerPackage: minPieces,
          maxQuantityPerPackage: maxPieces,
          netWeightG: packageWeightG,
          unitWeightG,
          packageUnit: version.unit_type === "piece" ? "本" : "パック",
          displayOrder: index + 1,
          isActive: master.is_active !== false,
          isSupabaseMaster: true,
          versionNo: Number(version.version_no),
          createdAt: master.created_at || now,
          updatedAt: master.updated_at || now
        };
      }).filter(Boolean);
      if (records.length !== data.packagingMasters.length) {
        throw new Error("Supabase包装マスタのUUID関連付けを解決できませんでした。");
      }
      localStorage.setItem(PACKAGING_MASTER_KEY, JSON.stringify(records));
      return true;
    }

    function initializeSupabaseMasterData() {
      if (!window.MeatProductionMasterData) return Promise.resolve({ success: false, source: "local" });
      if (!masterDataInitialization) {
        masterDataInitialization = window.MeatProductionMasterData
          .initialize(window.MEAT_SUPABASE_CONFIG || {})
          .then((result) => {
            if (result && result.data) applySupabaseMasterData(result.data);
            return result;
          })
          .catch((error) => {
            console.error("[Supabaseマスタ] アプリへの反映に失敗しました。既存ローカルマスタを使用します。", error);
            return { success: false, source: "local", error };
          });
      }
      return masterDataInitialization;
    }

    async function saveManufacturingRecordOfflineFirst(record, options = {}) {
      await initializeManufacturingSync();

      let masterResult = await initializeSupabaseMasterData();
      if (window.MeatProductionMasterData && typeof window.MeatProductionMasterData.refresh === "function") {
        const refreshed = await window.MeatProductionMasterData.refresh();
        if (refreshed && refreshed.data) {
          applySupabaseMasterData(refreshed.data);
          masterResult = refreshed;
        }
      }

      const bundle = window.MeatProductionSyncAdapter.fromLegacy(
        record,
        window.MEAT_SUPABASE_CONFIG || {},
        window.MeatProductionSync
      );
      if (!options.migration && window.MeatCrossDeviceSync && bundle.record.lot_number) {
        const reservedLot = await window.MeatCrossDeviceSync.reserveManufacturingLot(bundle.record.id, bundle.record.lot_number);
        if (reservedLot && reservedLot !== bundle.record.lot_number) {
          bundle.record.lot_number = reservedLot;
          if (bundle.record.legacy_payload && typeof bundle.record.legacy_payload === "object") {
            bundle.record.legacy_payload = { ...bundle.record.legacy_payload, lot: reservedLot };
          }
          record.lot = reservedLot;
        }
      }

      Object.assign(record, bundle.legacyRecordPatch);

      const missingIds = [];
      if (!bundle.record.business_id) missingIds.push("business_id");
      if (!bundle.record.product_id) missingIds.push("product_id");
      if (!bundle.record.recipe_id) missingIds.push("recipe_id");
      if (!bundle.record.recipe_version_id) missingIds.push("recipe_version_id");
      if (missingIds.length) {
        const source = masterResult && masterResult.source ? masterResult.source : "不明";
        const error = new Error(`Supabase同期に必要なマスタIDが不足しています（${missingIds.join(", ")} / master source: ${source}）。`);
        const local = await window.MeatProductionSync.putBundle(bundle.record, bundle.allocations, "error", error.message);
        record.syncStatus = "error";
        record.syncError = error.message;
        return {
          localSaved: true,
          synced: false,
          recordId: local.record.id,
          error,
          record: local.record,
          allocations: local.allocations
        };
      }

      const result = await window.MeatProductionSync.saveAndSync(bundle.record, bundle.allocations);
      record.syncStatus = result.synced ? "synced" : "error";
      record.syncError = result.error
        ? String(result.error && result.error.message ? result.error.message : result.error)
        : "";
      return result;
    }

    async function retryManufacturingSync(showMessage = true) {
      try {
        await initializeManufacturingSync();
        await runCrossDeviceIntegration();
        const count = await window.MeatProductionSync.pendingCount();
        refreshManufacturingSyncStatus(count);
        if (showMessage) showSaveToast(count ? `未同期の製造記録が${count}件あります。` : "同期しました。");
      } catch (error) {
        if (showMessage) showSaveToast("同期できませんでした。端末には保存されています。", "error");
      }

    function refreshManufacturingSyncStatus(count) {
      const status = document.getElementById("manufacturingSyncStatus");
      if (status) status.textContent = count ? `未同期：${count}件` : "未同期：0件";
    }

    const manufacturingIndexedHistory = new Map();

    function cachedBundleToManufacturingRecord(bundle) {
      // Merge all explicit historical quantities before attempting weight inference.
      return window.MeatHistoryRecovery.fromBundle(bundle);
    }

    function manufacturingRecoverySources(indexedRecords = [], cloudRows = []) {
      return [
        ...readLegacyStorageArray(OLD_MANUFACTURING_RECORDS_KEY).map((record) => ({ source: "archive", record })),
        ...readLegacyStorageArray(MANUFACTURING_RECORDS_KEY).map((record) => ({ source: "local", record })),
        ...indexedRecords.map((record) => ({ source: "indexed", record })),
        ...cloudRows.map((row) => ({ source: "cloud", record: window.MeatHistoryRecovery.fromBundle({ record: row, allocations: row.manufacturing_allocations }) }))
      ];
    }

    function canonicalManufacturingHistory(indexedRecords = [], cloudRows = []) {
      const saved = [...readLegacyStorageArray(OLD_SAVED_RECIPE_CALCULATIONS_KEY), ...loadSavedRecipeCalculations()];
      return window.MeatHistoryRecovery.mergeHistory(manufacturingRecoverySources(indexedRecords, cloudRows), saved)
        .map(recoverManufacturingFromSavedRecipe);
    }

    async function prepareManufacturingRecovery(pendingBundles) {
      await initializeSupabaseMasterData();
      if (window.MeatProductionMasterData && window.MeatProductionMasterData.refresh) {
        const result = await window.MeatProductionMasterData.refresh();
        if (result && result.data) applySupabaseMasterData(result.data);
      }
      const all = await window.MeatProductionSync.getLocalHistory();
      const cloud = await window.MeatProductionSync.fetchCloudHistory().catch(() => []);
      const canonical = canonicalManufacturingHistory(all.map(cachedBundleToManufacturingRecord), cloud);
      const recordForPending = (old) => canonical.find((r) => r.cloudRecordId === old.record.id || (old.record.lot_number && r.lot === old.record.lot_number)) || cachedBundleToManufacturingRecord(old);
      return pendingBundles.map((old) => {
        const lot = old.record.lot_number;
        const matches = cloud.filter((r) => r.lot_number === lot && r.status !== "deleted");
        const localIds = new Set(all.filter((b) => b.record.lot_number === lot && b.record.status !== "deleted").map((b) => b.record.id));
        const code = window.MeatProductionSyncAdapter.internalCode(recordForPending(old));
        const incompatible = matches.some((r) => {
          const remoteCode = window.MeatProductionSyncAdapter.internalCode(window.MeatHistoryRecovery.fromBundle({ record: r, allocations: r.manufacturing_allocations }));
          return code !== "UNKNOWN" && remoteCode !== "UNKNOWN" && code !== remoteCode;
        });
        if (recordForPending(old).recoveryConflict || matches.length > 1 || localIds.size > 1 || incompatible || (matches.length === 1 && matches[0].id !== old.record.id)) {
          return { ...old, recoveryError: `LOT競合：${lot}（自動変更しません）` };
        }
        const record = canonical.find((r) => r.cloudRecordId === old.record.id || (lot && r.lot === lot));
        if (!record) return { ...old, recoveryError: "復旧元の製造記録が見つかりません" };
        // Retain the existing cache/cloud identity and LOT, including deleted records.
        const rebuilt = window.MeatProductionSyncAdapter.fromLegacy({ ...record, cloudRecordId: old.record.id, lot, status: old.record.status }, window.MEAT_SUPABASE_CONFIG || {}, window.MeatProductionSync);
        return rebuilt;
      });
    }

    async function loadIndexedManufacturingHistory() {
      await initializeManufacturingSync();
      const bundles = await window.MeatProductionSync.getLocalHistory();
      manufacturingIndexedHistory.clear();
      bundles.forEach((bundle) => {
        const record = cachedBundleToManufacturingRecord(bundle);
        if (record.status !== "deleted") manufacturingIndexedHistory.set(manufacturingRecordId(record), record);
      });
      return Array.from(manufacturingIndexedHistory.values());
    }

    function combinedManufacturingHistory(indexedRecords = []) {
      const records = canonicalManufacturingHistory(indexedRecords).filter((record) => record.status !== "deleted");
      manufacturingIndexedHistory.clear();
      records.forEach((record) => manufacturingIndexedHistory.set(manufacturingRecordId(record), record));
      return records.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) || String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
    }

    let crossDeviceIntegrationPromise = null;

    function crossDeviceSyncStatusText() {
      if (!window.MeatCrossDeviceSync) return "";
      const status = window.MeatCrossDeviceSync.getStatus() || {};
      if (status.state === "synced") {
        const saved = status.savedRecipes || {};
        const manufacturing = status.manufacturing || {};
        return `端末統合：完了（レシピ${saved.total || 0}件 / 製造履歴${manufacturing.total || 0}件）`;
      }
      if (status.state === "conflict") {
        const conflicts = Array.isArray(status.conflicts) ? status.conflicts : [];
        const lots = conflicts.map((item) => item.lot || "LOT未設定").join("、");
        return `端末統合：LOT確認が必要（${lots}）`;
      }
      if (status.state === "partial") {
        const manufacturing = status.manufacturing || {};
        return `端末統合：製造履歴${manufacturing.total || 0}件を統合 / 保存済みレシピはSupabase更新待ち`;
      }
      if (status.state === "schema_required") return "端末統合：Supabase更新待ち";
      if (status.state === "error") return `端末統合エラー：${status.error || "詳細不明"}`;
      if (status.state === "running") return "端末統合：同期中";
      return "端末統合：確認中";
    }

    function manufacturingRecoveryScore(record) {
      if (!record) return 0;
      let score = 0;
      const positive = (value) => Number(value || 0) > 0;
      if (positive(record.meatTotal)) score += 5;
      if (positive(record.meat6mm) || positive(record.meat3mm)) score += 2;
      if (positive(record.packageCount) || positive(record.completedCount)) score += 5;
      if (positive(record.herbStandardPackageCount) || positive(record.herbEventPieceCount)) score += 4;
      if (positive(record.smokedCount) || positive(record.unsmokedCount)) score += 4;
      if (Array.isArray(record.recipeRows) && record.recipeRows.length) score += 5;
      if (positive(record.totalWeight) || positive(record.recipeTotal)) score += 2;
      if (positive(record.savedUnitWeightG) || positive(record.unitWeight) || positive(record.packWeight)) score += 1;
      if (record.memo) score += 1;
      return score;
    }

    async function runCrossDeviceIntegration() {
      if (!window.MeatCrossDeviceSync) {
        await initializeManufacturingSync();
        return { historyRefresh: await window.MeatProductionSync.refreshHistoryCache() };
      }
      if (crossDeviceIntegrationPromise) return crossDeviceIntegrationPromise;
      crossDeviceIntegrationPromise = (async () => {
        await initializeManufacturingSync();
        await initializeSupabaseMasterData();
        window.MeatCrossDeviceSync.initialize(window.MEAT_SUPABASE_CONFIG || {});
        const result = await window.MeatCrossDeviceSync.syncAll({
          config: window.MEAT_SUPABASE_CONFIG || {},
          manufacturing: {
            loadLocal: async () => canonicalManufacturingHistory(await loadIndexedManufacturingHistory()),
            recoverRecord: (record, cloudRows) => canonicalManufacturingHistory([record], cloudRows).find((r) => r.lot === record.lot) || record,
            saveLocal: saveManufacturingRecords,
            uploadLocal: (record, options) => saveManufacturingRecordOfflineFirst(record, options)
          }
        });
        if (result && result.state === "synced" && window.MeatProductionSync) {
          result.historyRefresh = await window.MeatProductionSync.refreshHistoryCache().catch(() => null);
        }
        const status = document.getElementById("crossDeviceSyncStatus");
        if (status) status.textContent = crossDeviceSyncStatusText();
        return result;
      })().finally(() => {
        crossDeviceIntegrationPromise = null;
      });
      return crossDeviceIntegrationPromise;
    }

    async function initApp() {
      const config = window.MEAT_SUPABASE_CONFIG || {};
      if (!window.MeatProductionAuth || config.enabled === false || !config.url || !config.publishableKey) {
        startApplication();
        return;
      }
      try {
        const authState = await window.MeatProductionAuth.initialize(config);
        if (authState.session && authState.session.access_token) {
          startApplication();
          return;
        }
        if (navigator.onLine) {
          showSupabaseLogin();
          return;
        }
      } catch (error) {
        console.warn("[Supabase Auth] セッション確認に失敗したため、ローカルデータで起動します。", error);
      }
      startApplication();
    }

    function initialPackagingMasterRecords() {
      const now = new Date().toISOString();
      return [
        { packagingId: "PACK_ARABIKI_STANDARD", productId: "PROD_ARABIKI", packagingName: "通常", quantityPerPackage: 3, netWeightG: 130, unitWeightG: 43.3, packageUnit: "パック", displayOrder: 1, isActive: true },

        { packagingId: "PACK_CHEESE_STANDARD", productId: "PROD_CHEESE", packagingName: "通常", quantityPerPackage: 3, netWeightG: 130, unitWeightG: 43.3, packageUnit: "パック", displayOrder: 1, isActive: true },
        { packagingId: "PACK_CHORIZO_STANDARD", productId: "PROD_CHORIZO", packagingName: "通常", quantityPerPackage: 3, netWeightG: 130, unitWeightG: 43.3, packageUnit: "パック", displayOrder: 1, isActive: true },
        { packagingId: "PACK_GIBIER_CENTER_STANDARD", productId: "PROD_GIBIER_CENTER", packagingName: "通常", quantityPerPackage: 1, netWeightG: 70, unitWeightG: 70, packageUnit: "本", displayOrder: 1, isActive: true },
        { packagingId: "PACK_TOGE_CHAya_STANDARD", productId: "PROD_TOGE_CHAya", packagingName: "通常", quantityPerPackage: 2, netWeightG: 70, unitWeightG: 35, packageUnit: "パック", displayOrder: 1, isActive: true }
      ].map((record) => ({ ...record, createdAt: now, updatedAt: now }));
    }

    function productIdForName(productName) {
      const product = PRODUCT_MASTER.find((item) => item.productName === productName);
      return product ? product.productId : "";
    }

    function productNameForId(productId) {
      const product = PRODUCT_MASTER.find((item) => item.productId === productId);
      return product ? product.productName : "";
    }

    function initialPackagingId(productId, packagingName) {
      const initial = initialPackagingMasterRecords().find((item) => item.productId === productId && item.packagingName === packagingName);
      return initial ? initial.packagingId : "";
    }

    function normalizePackagingRecord(record, index) {
      const productId = record.productId || productIdForName(record.productName);
      const packagingName = record.packagingName || "";
      const initialRecord = initialPackagingMasterRecords().find((item) => item.productId === productId && item.packagingName === packagingName);
      return {
        packagingId: record.packagingId || initialPackagingId(productId, packagingName) || record.id || `PACK_CUSTOM_${Date.now()}_${index}`,
        packagingVersionId: record.packagingVersionId || "",
        packagingInternalCode: record.packagingInternalCode || "",
        productId,
        supabaseProductId: record.supabaseProductId || "",
        packagingName,
        quantityPerPackage: Number(record.quantityPerPackage != null ? record.quantityPerPackage : record.pieceCount),
        minQuantityPerPackage: record.minQuantityPerPackage == null ? null : Number(record.minQuantityPerPackage),
        maxQuantityPerPackage: record.maxQuantityPerPackage == null ? null : Number(record.maxQuantityPerPackage),
        netWeightG: record.netWeightG == null && record.contentWeight == null ? null : Number(record.netWeightG != null ? record.netWeightG : record.contentWeight),
        unitWeightG: Number(record.unitWeightG != null ? record.unitWeightG : record.unitWeight),
        packageUnit: record.packageUnit || record.packagingUnit || "パック",
        displayOrder: Number.isInteger(Number(record.displayOrder)) ? Number(record.displayOrder) : (initialRecord ? initialRecord.displayOrder : index + 1),
        isActive: record.isActive !== false,
        isSupabaseMaster: record.isSupabaseMaster === true,
        versionNo: record.versionNo == null ? null : Number(record.versionNo),
        createdAt: record.createdAt || new Date().toISOString(),
        updatedAt: record.updatedAt || new Date().toISOString()
      };
    }

    function loadPackagingMaster() {
      try {
        const rawValue = localStorage.getItem(PACKAGING_MASTER_KEY);
        if (rawValue == null) {
          const initialRecords = initialPackagingMasterRecords();
          localStorage.setItem(PACKAGING_MASTER_KEY, JSON.stringify(initialRecords));
          return initialRecords;
        }
        const parsed = JSON.parse(rawValue);
        if (!Array.isArray(parsed)) return [];
        const normalized = parsed.map(normalizePackagingRecord);
        if (JSON.stringify(normalized) !== JSON.stringify(parsed)) localStorage.setItem(PACKAGING_MASTER_KEY, JSON.stringify(normalized));
        return normalized;
      } catch (error) {
        return [];
      }
    }

    function savePackagingMaster(records) {
      localStorage.setItem(PACKAGING_MASTER_KEY, JSON.stringify(records));
    }

    function formatPackagingNumber(value) {
      const number = Number(value || 0);
      return Number.isInteger(number) ? String(number) : String(Number(number.toFixed(1)));
    }

    function packagingProductIdForOption(option) {
      if (!option) return "";
      if (option.productId) return option.productId;
      if (option.category === "自社レシピ") return productIdForName(option.savedRecipeName || option.label);
      if (option.recipe.kind === "gibier") return "PROD_GIBIER_CENTER";
      if (option.recipe.kind === "yamanoya") return "PROD_YAMAGOYA";
      return productIdForName(option.recipe.clientName || option.label.split(" /")[0]);
    }

    function packagingProductIdForRecord(record) {
      if (record.productId) return record.productId;
      if (record.category === "自社レシピ") return productIdForName(record.savedRecipeName || String(record.recipeName || "").replace(/（.*$/, ""));
      if (isGibierManufacturingRecord(record)) return "PROD_GIBIER_CENTER";
      if (String(record.recipeName || "").includes("山小屋")) return "PROD_YAMAGOYA";
      if (String(record.recipeName || "").includes("ざんざ亭")) return "PROD_ZANZATEI";
      if (String(record.recipeName || "").includes("峠の茶屋")) return "PROD_TOGE_CHAya";
      return productIdForName(String(record.recipeName || "").split(" /")[0]);
    }

    function activePackagingForProduct(productId) {
      return loadPackagingMaster().map((record, index) => ({ record, index }))
        .filter(({ record }) => record.productId === productId && record.isActive)
        .sort((a, b) => a.record.displayOrder - b.record.displayOrder || a.index - b.index)
        .map(({ record }) => record);
    }

    function packagingStandardHtml(productId) {
      const records = activePackagingForProduct(productId);
      if (records.length === 0) return `<div class="empty">包装基準が登録されていません。</div>`;
      return records.map((packaging) => {
        const unitWeight = Number(packaging.unitWeightG || 0);
        const unitText = `${Number.isInteger(unitWeight) ? "" : "約"}${formatPackagingNumber(unitWeight)}g／本`;
        const hasRange = Number(packaging.minQuantityPerPackage) > 0 && Number(packaging.maxQuantityPerPackage) >= Number(packaging.minQuantityPerPackage);
        const piecesText = hasRange
          ? `${formatPackagingNumber(packaging.minQuantityPerPackage)}～${formatPackagingNumber(packaging.maxQuantityPerPackage)}本`
          : `${formatPackagingNumber(packaging.quantityPerPackage)}本`;
        const packageWeightText = Number(packaging.netWeightG) > 0
          ? `${piecesText}／${formatPackagingNumber(packaging.netWeightG)}g`
          : `${piecesText}／固定包装重量なし`;
        return `
          <div class="packaging-standard">
            <strong>包装基準：${escapeHtml(packaging.packagingName)}</strong>
            <div>${packageWeightText}</div>
            <div>${unitText}</div>
            <div>包装単位：${escapeHtml(packaging.packageUnit)}</div>
          </div>
        `;
      }).join("");
    }

              <input id="packagingUnitWeight" type="number" inputmode="decimal" min="0.1" step="0.1" value="${escapeHtml(record.unitWeightG || "")}">

              <select id="packagingUnit"><option value="本" ${record.packageUnit === "本" ? "selected" : ""}>本</option><option value="パック" ${record.packageUnit !== "本" ? "selected" : ""}>パック</option></select>

            <button id="packagingMasterSave" class="primary" type="button">保存</button>
          </div>
        </section>
      `;
      const quantity = document.getElementById("packagingQuantity");
      const netWeight = document.getElementById("packagingNetWeight");
      const unitWeight = document.getElementById("packagingUnitWeight");
      const calculateUnitWeight = () => {
        const pieces = Number(quantity.value || 0);
        const weight = Number(netWeight.value || 0);
        if (pieces > 0 && weight > 0) unitWeight.value = String(Number((weight / pieces).toFixed(1)));
      };
      [quantity, netWeight].forEach((element) => element.addEventListener("input", calculateUnitWeight));
      document.getElementById("packagingMasterSave").addEventListener("click", () => savePackagingMasterForm(packagingId));
      if (!packagingId) calculateUnitWeight();
    }

    function savePackagingMasterForm(packagingId = "") {
      const productId = document.getElementById("packagingProductId").value;
      const packagingName = document.getElementById("packagingName").value.trim();
      const quantityPerPackage = Number(document.getElementById("packagingQuantity").value);
      const netWeightG = Number(document.getElementById("packagingNetWeight").value);
      const unitWeightG = Number(document.getElementById("packagingUnitWeight").value);
      const packageUnit = document.getElementById("packagingUnit").value;
      const displayOrder = Number(document.getElementById("packagingDisplayOrder").value);
      const isActive = document.getElementById("packagingIsActive").checked;
      if (!productId || !packagingName || !Number.isInteger(quantityPerPackage) || quantityPerPackage < 1 || !Number.isFinite(netWeightG) || netWeightG <= 0 || !Number.isFinite(unitWeightG) || unitWeightG <= 0 || !Number.isInteger(displayOrder) || displayOrder < 0 || !packageUnit) {
        showSaveToast("包装マスタの入力内容を確認してください。", "error");
        return;
      }
      const records = loadPackagingMaster();
      if (packagingId && !records.some((record) => record.packagingId === packagingId)) {
        showSaveToast("編集対象の包装情報が見つかりません。", "error");
        return;
      }
      if (records.some((record) => record.packagingId !== packagingId && record.productId === productId && record.packagingName === packagingName)) {
        showSaveToast("同じ商品と包装名称が登録されています。", "error");
        return;
      }
      const existing = records.find((record) => record.packagingId === packagingId);
      const now = new Date().toISOString();
      const item = {
        packagingId: packagingId || createRecordId("PACK_CUSTOM").toUpperCase(),
        productId,
        packagingName,
        quantityPerPackage,
        netWeightG,
        unitWeightG,
        packageUnit,
        displayOrder,
        isActive,
        createdAt: existing ? existing.createdAt : now,
        updatedAt: now
      };
      const index = records.findIndex((record) => record.packagingId === packagingId);
      if (index >= 0) records[index] = item;
      else records.push(item);
      try {
        savePackagingMaster(records);
        showPackagingMasterList("保存しました");
        showSaveToast("保存しました。");
      } catch (error) {
        showSaveToast("保存できませんでした。もう一度お試しください。", "error");
      }

    function isSavedRecipeRegistered(savedRecipe, savedRecipes, manufacturingRecords) {
      const savedId = savedRecipeRecordId(savedRecipe);

      const matchingSaved = savedRecipes.filter((record) => savedRecipeLegacyKey(record) === legacyKey);
      const matchingManufacturing = manufacturingRecords.filter((record) => savedRecipeLegacyKey(record) === legacyKey && !record.savedRecipeId && !record.savedCalculationId);
      return matchingSaved.length === 1 && matchingManufacturing.length === 1;

    function recipeCodeForRecipe(recipe) {
      if (recipe.recipeId === ADDITIVE_FREE_RECIPE_ID || recipe.kind === "fixed-own") return "ADDITIVE-FREE-ARABIKI";
      if (recipe.kind === "yamanoya") return "YAMAGOYA";

      if (recipe.name === ownRecipes.cheese.name || recipe.baseRecipeName === ownRecipes.cheese.name) return "CHEESE";
      if (recipe.name === ownRecipes.herb.name || recipe.baseRecipeName === ownRecipes.herb.name) return "HERB";
      if (recipe.name === ownRecipes.chorizo.name || recipe.baseRecipeName === ownRecipes.chorizo.name) return "CHORIZO";
      return "RECIPE";

    function packagingSpecForRecordOption(option) {
      if (!option) return null;
      const productId = packagingProductIdForOption(option);
      const packagingName = option.packagingKey === "herbEvent" ? "イベント" : "通常";
      return packagingSpecForProductAndName(productId, packagingName);
    }

    function packagingMasterIssue(productId, packagingName = "通常") {
      if (!productId || !PRODUCT_MASTER.some((item) => item.productId === productId)) return "商品IDに対応する商品マスタが見つかりません。";
      const matching = loadPackagingMaster().filter((item) => item.productId === productId && item.packagingName === packagingName);
      if (matching.length === 0) return `${packagingName}の包装マスタが見つかりません。`;
      const registered = matching.filter((item) => item.isActive !== false).sort((a, b) => Number(a.displayOrder || 0) - Number(b.displayOrder || 0))[0];
      if (!registered) return `${packagingName}に使用中の包装がありません。`;
      if (!registered.packagingId) return "包装IDが設定されていません。";
      if (!registered.packageUnit) return "包装単位が設定されていません。";
      const hasFixedPieces = Number.isFinite(Number(registered.quantityPerPackage)) && Number(registered.quantityPerPackage) > 0;
      const hasRange = Number(registered.minQuantityPerPackage) > 0 && Number(registered.maxQuantityPerPackage) >= Number(registered.minQuantityPerPackage);
      if (!hasFixedPieces && !hasRange) return "内容本数が設定されていません。";
      if (!hasRange && (!Number.isFinite(Number(registered.netWeightG)) || Number(registered.netWeightG) <= 0)) return "内容量が設定されていません。";
      if (!Number.isFinite(Number(registered.unitWeightG)) || Number(registered.unitWeightG) <= 0) return "1本重量が設定されていません。";
      return "";
    }

    function packagingMasterIssueForOption(option) {
      if (!option) return "レシピ情報が見つかりません。";
      const packagingName = option.packagingKey === "herbEvent" ? "イベント" : "通常";
      return packagingMasterIssue(packagingProductIdForOption(option), packagingName);
    }

    function packagingMasterUserMessage(option, issue, logIssue = false) {
      const name = option ? (option.savedRecipeName || option.label || "選択商品の") : "選択商品の";
      if (logIssue && issue && globalThis.console && typeof console.error === "function") console.error(`[包装マスタ] ${name}: ${issue}`);
      return `${name}の包装基準が不足しています。包装マスタを確認してください。`;
    }

    function packagingSpecForProductAndName(productId, packagingName) {
      if (packagingMasterIssue(productId, packagingName)) return null;
      const registered = loadPackagingMaster()
        .filter((item) => item.productId === productId && item.packagingName === packagingName && item.isActive !== false)
        .sort((a, b) => Number(a.displayOrder || 0) - Number(b.displayOrder || 0))[0];
      const hasRange = Number(registered.minQuantityPerPackage) > 0 && Number(registered.maxQuantityPerPackage) >= Number(registered.minQuantityPerPackage);
      const isPieceUnit = registered.packageUnit === "本" || hasRange;
      return {
        packagingId: registered.packagingId,
        productId: registered.productId,
        unit: registered.packageUnit,
        countLabel: isPieceUnit ? "完成本数" : "包装数",
        unitWeightLabel: isPieceUnit ? "1本重量" : "1包装重量",
        unitPiecesLabel: isPieceUnit ? "" : "1包装本数",
        unitWeight: Number(isPieceUnit ? registered.unitWeightG : registered.netWeightG),
        unitPieces: Number(registered.quantityPerPackage),
        unitWeightG: Number(registered.unitWeightG),
        minUnitPieces: registered.minQuantityPerPackage,
        maxUnitPieces: registered.maxQuantityPerPackage,
        packagingVersionId: registered.packagingVersionId || ""
      };
    }

    function herbPackagingSpecs() {
      return {
        standard: packagingSpecForProductAndName("PROD_HERB", "通常"),
        event: packagingSpecForProductAndName("PROD_HERB", "イベント")
      };
    }

    function loadSavedRecipeCalculations() {
      const parsed = readStorageArray(SAVED_RECIPE_CALCULATIONS_KEY, OLD_SAVED_RECIPE_CALCULATIONS_KEY);
      let changed = false;
      const normalized = parsed.map((record, index) => {
        let item = record;
        if (!item.savedRecipeId && !item.id) {
          changed = true;
          const savedRecipeId = `saved-recipe-${item.savedAt || item.createdAt || Date.now()}-${index}`;
          item = { ...item, id: savedRecipeId, savedRecipeId };
        }
        const enriched = enrichSavedRecipeCalculation(item);
        if (enriched.totalWeight !== item.totalWeight || enriched.waterAmount !== item.waterAmount || enriched.theoreticalFinishedWeight !== item.theoreticalFinishedWeight) changed = true;
        return enriched;
      });
      if (changed) {
        localStorage.setItem(SAVED_RECIPE_CALCULATIONS_KEY, JSON.stringify(normalized));
      }
      return normalized;
    }

    function createRecordId(prefix) {
      if (globalThis.crypto && typeof globalThis.crypto.randomUUID === "function") return `${prefix}-${globalThis.crypto.randomUUID()}`;
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 12)}`;
    }

    function saveRecipeCalculation(calculation) {
      if (!calculation) return;
      const records = loadSavedRecipeCalculations();
      const savedRecipeId = createRecordId("saved-recipe");
      const enriched = enrichSavedRecipeCalculation({
        ...calculation,
        id: savedRecipeId,
        savedRecipeId,
        memo: calculation.memo || "",
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      });
      records.unshift(enriched);
      saveSavedRecipeCalculations(records);
    }

    function saveSavedRecipeCalculations(records) {
      localStorage.setItem(SAVED_RECIPE_CALCULATIONS_KEY, JSON.stringify(records));
      scheduleSavedRecipeCloudSync();
    }

    function savedRecipeRecordId(record) {
      return record.savedRecipeId || record.id;
    }

    function findSavedRecipeCalculation(prepDate, category, recipeName) {
      return loadSavedRecipeCalculations().find((item) => (
        item.prepDate === prepDate &&
        item.category === category &&
        item.recipeName === recipeName
      ));
    }

    function findRecoverySavedRecipe(record) {
      const savedPrimary = loadSavedRecipeCalculations();
      const savedArchive = readLegacyStorageArray(OLD_SAVED_RECIPE_CALCULATIONS_KEY);
      const savedMap = new Map();
      [...savedArchive, ...savedPrimary].forEach((item, index) => {
        const id = item.savedRecipeId || item.id || `legacy-saved-${item.savedAt || item.createdAt || index}`;
        const existing = savedMap.get(id);
        if (!existing || manufacturingRecoveryScore(item) > manufacturingRecoveryScore(existing)) savedMap.set(id, item);
      });
      const saved = Array.from(savedMap.values()).map(enrichSavedRecipeCalculation);
      const directId = record && (record.savedRecipeId || record.savedCalculationId);
      if (directId) {
        const byId = saved.find((item) => savedRecipeRecordId(item) === directId);
        if (byId) return byId;
      }
      if (!record) return null;
      const recipeName = String(record.savedRecipeName || record.recipeName || "").replace(/（.*$/, "");
      const candidates = saved.filter((item) => (
        item.prepDate === record.prepDate &&
        (!record.category || item.category === record.category) &&
        String(item.savedRecipeName || item.recipeName || "").replace(/（.*$/, "") === recipeName
      ));
      return candidates.length === 1 ? candidates[0] : null;
    }

    function recoverManufacturingFromSavedRecipe(record) {
      if (!record) return record;
      const saved = findRecoverySavedRecipe(record);
      let restored = window.MeatHistoryRecovery.restoreSaved(record, saved ? [saved] : []);
      const option = saved ? recordOptionForSavedRecipe(saved) : null;
      const spec = option ? packagingSpecForRecordOption(option) : null;
      if (option) {
        restored = { ...restored, recipeId: restored.recipeId || option.id, productId: restored.productId || packagingProductIdForOption(option),
          recipeCode: restored.recipeCode || saved.recipeCode || recipeCodeForRecipe(option.recipe),
          recipeKind: restored.recipeKind || (option.recipe && option.recipe.kind), packagingKey: restored.packagingKey || saved.packagingKey || option.packagingKey };
      }
      if (spec && !(Number(restored.savedUnitWeightG) > 0)) {
        restored.savedUnitWeightG = spec.unitWeight;
        restored.packagingUnit = restored.packagingUnit || spec.unit;
      }
      return window.MeatHistoryRecovery.inferCount(restored);
    }

    function generateManufacturingLot(dateString, category, recipe, packagingKey = "") {
      const datePart = (dateString || todayString()).replace(/-/g, "");
      const categoryCode = category === "自社レシピ" ? "JI" : "IT";
      const recipeCode = packagingKey === "herbProduct" ? "HERB-P" : packagingKey === "herbEvent" ? "HERB-E" : recipeCodeForRecipe(recipe);
      const base = `${datePart}-${categoryCode}-${recipeCode}`;
      const count = loadManufacturingRecords().filter((record) => String(record.lot || "").startsWith(base)).length + 1;
      return `${base}-${String(count).padStart(2, "0")}`;
    }

      const prepDate = document.getElementById("savedRecipePrepDate");

      const renderPreview = () => {
        const updated = recalculateSavedRecipe(record, meat6mm ? Number(meat6mm.value || 0) : record.meat6mm, meat3mm ? Number(meat3mm.value || 0) : record.meat3mm, prepDate.value, memo.value);
        preview.innerHTML = `${meatInfoHtml({ meat6mm: updated.meat6mm, meat3mm: updated.meat3mm, meatTotal: updated.meatTotal })}${tableHtml(updated.rows, updated.total)}`;
      };
      [prepDate, meat6mm, meat3mm, memo].filter(Boolean).forEach((element) => element.addEventListener("input", renderPreview));

        const records = loadSavedRecipeCalculations();

    function recalculateSavedRecipe(record, meat6mmValue, meat3mmValue, prepDate, memo) {
      if (record.recipeId === ADDITIVE_FREE_RECIPE_ID || record.recipeKind === "fixed-own") {
        return enrichSavedRecipeCalculation({
          ...record,
          prepDate,
          meat6mm: 1800,
          meat3mm: 1800,
          meatTotal: 3600,
          emulsionWeight: 0,
          rows: additiveFreeIngredientRows(),
          total: 823.6,
          memo,
          updatedAt: new Date().toISOString()
        });
      }
      const meat6mm = Math.max(Number(meat6mmValue || 0), 0);
      const meat3mm = Math.max(Number(meat3mmValue || 0), 0);
      const meatTotal = meat6mm + meat3mm;
      let rows = [];
      let emulsionWeight = 0;
      if (record.recipeKind === "yamanoya") {
        rows = calculateYamanoya(meatTotal);
      } else if (record.recipeKind === "gibier") {
        rows = calculateGibier(meat6mm, meat3mm);
      } else {
        const water = meatTotal * 0.2;
        emulsionWeight = (meatTotal + water) * 0.2;
        rows = calculateOwnRecipe(record.savedRecipeName || record.recipeName, meatTotal, emulsionWeight, "自動計算");
      }
      const total = rows.reduce((sum, row) => sum + row.calculated, 0);
      return enrichSavedRecipeCalculation({ ...record, prepDate, meat6mm, meat3mm, meatTotal, emulsionWeight, rows, total, memo, updatedAt: new Date().toISOString() });
    }

    function togeComponentTypeForOption(option) {
      if (!option || option.category !== "自社レシピ") return "";
      if (option.packagingKey === "arabiki") return "arabiki";
      if (option.id === "own:herb" || option.packagingKey === "herbProduct" || option.packagingKey === "herbEvent") return "herb";
      return "";
    }

    function togeComponentTypeForRecord(record) {
      if (record.togeComponentType) return record.togeComponentType;
      if (record.category !== "自社レシピ") return "";
      if (record.packagingKey === "arabiki" || record.savedRecipeName === "あらびき") return "arabiki";
      if (record.recipeId === "own:herb" || record.packagingKey === "herbProduct" || record.packagingKey === "herbEvent" || record.savedRecipeName === "ハーブ") return "herb";
      return "";
    }

    function generateTogeAllocationId(dateValue) {
      const datePart = String(dateValue || todayString()).replace(/-/g, "");
      const prefix = `TGE-${datePart}-`;
      const numbers = loadManufacturingRecords().map((record) => String(record.togeAllocationId || ""))
        .filter((id) => id.startsWith(prefix))
        .map((id) => Number(id.slice(prefix.length)) || 0);
      return `${prefix}${String(Math.max(0, ...numbers) + 1).padStart(3, "0")}`;
    }

    function availableTogeAllocations(componentType, currentRecordId = "") {
      const grouped = new Map();
      loadManufacturingRecords().forEach((record) => {
        if (!record.togeAllocationEnabled || !record.togeAllocationId || manufacturingRecordId(record) === currentRecordId) return;
        const component = togeComponentTypeForRecord(record);
        if (!component) return;
        if (!grouped.has(record.togeAllocationId)) grouped.set(record.togeAllocationId, {});
        grouped.get(record.togeAllocationId)[component] = Number(record.togePieceCount || 0);
      });
      return [...grouped.entries()]
        .filter(([, parts]) => !parts[componentType])
        .map(([id, parts]) => ({ id, parts }))
        .sort((a, b) => b.id.localeCompare(a.id));
    }

    function togeAllocationState(allocationId, candidate = null, currentRecordId = "") {
      if (!allocationId) return { state: "", message: "" };
      const parts = {};
      loadManufacturingRecords().forEach((record) => {
        if (!record.togeAllocationEnabled || record.togeAllocationId !== allocationId || manufacturingRecordId(record) === currentRecordId) return;
        const component = togeComponentTypeForRecord(record);
        if (component) parts[component] = Number(record.togePieceCount || 0);
      });
      if (candidate && candidate.togeAllocationEnabled && candidate.togeAllocationId === allocationId) {
        parts[candidate.togeComponentType] = Number(candidate.togePieceCount || 0);
      }
      const hasArabiki = Number.isFinite(parts.arabiki);
      const hasHerb = Number.isFinite(parts.herb);
      if (hasArabiki && hasHerb) {
        const complete = Math.min(parts.arabiki, parts.herb);
        if (parts.arabiki === parts.herb) return { state: "完了", message: `峠の茶屋：${complete}パック分完了` };
        const difference = Math.abs(parts.arabiki - parts.herb);
        const excess = parts.arabiki > parts.herb ? `あらびき${difference}本` : `ハーブ${difference}本`;
        return { state: "本数不一致", message: `峠の茶屋用の本数が一致していません。\nあらびき：${parts.arabiki}本\nハーブ：${parts.herb}本\n差：${difference}本\n完成可能：${complete}パック\n未対応：${excess}` };
      }
      if (hasArabiki) return { state: "未完了", message: `峠の茶屋振分ID：${allocationId}\nあらびき：${parts.arabiki}本\nハーブ：未入力\n状態：組み合わせ未完了` };
      if (hasHerb) return { state: "未完了", message: `峠の茶屋振分ID：${allocationId}\nあらびき：未入力\nハーブ：${parts.herb}本\n状態：組み合わせ未完了` };
      return { state: "", message: "" };
    }

    function validateTogeAllocation(record, currentRecordId = "") {
      if (!record.togeAllocationEnabled) return "";
      const rawCount = Number(record.togePieceCount);
      if (!Number.isInteger(rawCount) || rawCount <= 0) return "峠の茶屋用本数を入力してください。";
      if (!record.togeAllocationId) return "峠の茶屋振分IDを選択してください。";
      const duplicate = loadManufacturingRecords().some((item) => (
        manufacturingRecordId(item) !== currentRecordId && item.togeAllocationEnabled &&
        item.togeAllocationId === record.togeAllocationId && togeComponentTypeForRecord(item) === record.togeComponentType
      ));
      if (duplicate) return `この峠の茶屋振分IDには、すでに${record.togeComponentType === "arabiki" ? "あらびき" : "ハーブ"}が登録されています。`;
      const baseFinishedWeight = Number(record.finishedWeight || 0) - Number(record.togeAllocatedWeight || 0);
      const theoreticalWeight = Number(record.theoreticalFinishedWeight || 0);
      if (theoreticalWeight > 0 && baseFinishedWeight <= theoreticalWeight && Number(record.finishedWeight || 0) > theoreticalWeight) {
        return "峠の茶屋への振り分け量が完成重量を超えています。";
      }
      return "";
    }

      };

      const applyDraft = () => {

        refreshRecipeOptions();
        ids.forEach((id) => {
          if (draft[id] != null && elements[id]) {
            if (elements[id].type === "checkbox") elements[id].checked = Boolean(draft[id]);

          }
        });

      let isSavingRecord = false;
      recordSaveButton.addEventListener("click", async () => {
        if (isSavingRecord) return;
        if (!elements.recordPrepDate.value || !elements.recordDate.value || !elements.recordRecipe.value) {
          showSaveToast("必須項目を入力してください。", "error");
          return;
        }
        isSavingRecord = true;
        recordSaveButton.disabled = true;
        try {
          const record = collectManufacturingRecord(elements);
          const selectedOption = getRecordRecipeOption(elements.recordRecipe.value, elements.recordCategory.value);
          const herbMasterIssue = isCombinedHerbOption(selectedOption) ? (packagingMasterIssue("PROD_HERB", "通常") || packagingMasterIssue("PROD_HERB", "イベント")) : "";
          const masterIssue = herbMasterIssue || packagingMasterIssueForOption(selectedOption);
          const missingHerbWeights = isCombinedHerbManufacturingRecord(record) && (!Number.isFinite(Number(record.herbStandardUnitWeightG)) || Number(record.herbStandardUnitWeightG) <= 0 || !Number.isFinite(Number(record.herbEventUnitWeightG)) || Number(record.herbEventUnitWeightG) <= 0);
          const missingSingleWeight = !isCombinedHerbManufacturingRecord(record) && (record.savedUnitWeightG == null || !Number.isFinite(Number(record.savedUnitWeightG)) || Number(record.savedUnitWeightG) <= 0);
          if (masterIssue || missingHerbWeights || missingSingleWeight) {
            showSaveToast(packagingMasterUserMessage(selectedOption, masterIssue || "完成重量計算に必要な基準重量がありません。", true), "error");
            return;
          }
          const allocationError = validateTogeAllocation(record);
          if (allocationError) {
            showSaveToast(allocationError, "error");
            return;
          }
          record.id = window.MeatProductionSync ? window.MeatProductionSync.uuid() : createRecordId("manufacturing-record");
          record.manufacturingRecordId = record.id;
          record.createdAt = new Date().toISOString();
          record.updatedAt = new Date().toISOString();
          record.savedAt = record.createdAt;
          const syncResult = await saveManufacturingRecordOfflineFirst(record);
          const records = loadManufacturingRecords();
          records.unshift(record);
          saveManufacturingRecords(records);
          clearScreenState();
          goodNotesText.value = buildManufacturingRecordText(record);
          showSaveToast(syncResult.synced ? "保存しました。" : "端末に保存しました。クラウド同期は保留中です。");
        } catch (error) {
          showSaveToast("保存できませんでした。もう一度お試しください。", "error");
        } finally {
          isSavingRecord = false;
          recordSaveButton.disabled = false;
        }
      });
      render();
    }

    function collectManufacturingRecord(elements) {
      const option = getRecordRecipeOption(elements.recordRecipe.value, elements.recordCategory.value);
      if (!option) throw new Error("選択されたレシピ情報を取得できません。");
      const selectedSavedRecipeId = elements.recordSavedRecipeId ? elements.recordSavedRecipeId.value : "";
      const savedCalculation = selectedSavedRecipeId
        ? loadSavedRecipeCalculations().find((record) => savedRecipeRecordId(record) === selectedSavedRecipeId)
        : findSavedRecipeCalculation(elements.recordPrepDate.value, option.category, option.savedRecipeName || option.label);
      const packagingSpec = packagingSpecForRecordOption(option);
      const isGibier = option.recipe.kind === "gibier";
      const isCombinedHerb = isCombinedHerbOption(option);
      const herbSpecs = isCombinedHerb ? herbPackagingSpecs() : { standard: null, event: null };
      const packagingUnit = isCombinedHerb ? (herbSpecs.standard ? herbSpecs.standard.unit : "") : (isGibier ? "本" : (packagingSpec ? packagingSpec.unit : ""));
      const unitWeight = isCombinedHerb ? null : (packagingSpec ? packagingSpec.unitWeight : null);
      const unitPieces = isCombinedHerb ? null : (packagingSpec ? packagingSpec.unitPieces : null);
      const inputCount = Number(elements.recordPackageCount.value || 0);
      const herbStandardPackageCount = isCombinedHerb ? Number(elements.recordHerbStandardPackageCount.value || 0) : null;
      const herbEventPieceCount = isCombinedHerb ? Number(elements.recordHerbEventPieceCount.value || 0) : null;
      const theoreticalFinishedWeight = savedCalculation ? Number(savedCalculation.theoreticalFinishedWeight || 0) : 0;
      const gibierMetrics = calculateGibierProductionMetrics(elements.recordSmokedCount.value, elements.recordUnsmokedCount.value, theoreticalFinishedWeight, unitWeight);
      const smokedCount = isGibier ? gibierMetrics.smokedCount : 0;
      const unsmokedCount = isGibier ? gibierMetrics.unsmokedCount : 0;
      const completedNumber = isGibier ? gibierMetrics.completedCount : inputCount;
      const packageCount = isCombinedHerb || packagingUnit === "本" ? "" : elements.recordPackageCount.value;
      const completedCount = isCombinedHerb ? "" : (packagingUnit === "本" ? String(completedNumber) : "");
      const togeComponentType = togeComponentTypeForOption(option);
      const togeAllocationEnabled = Boolean(togeComponentType && elements.recordTogeAllocationEnabled && elements.recordTogeAllocationEnabled.checked);
      const togePieceCount = togeAllocationEnabled ? Number(elements.recordTogePieceCount.value || 0) : 0;
      const togeAllocatedWeight = togeAllocationEnabled && Number.isFinite(togePieceCount) ? togePieceCount * 35 : 0;
      const selectedTogeId = elements.recordTogeAllocationId ? elements.recordTogeAllocationId.value : "";
      const togeAllocationId = togeAllocationEnabled ? (selectedTogeId === "__new__" ? elements.recordTogeGeneratedId.value : selectedTogeId) : "";
      const herbStandardUnitWeightG = herbSpecs.standard ? herbSpecs.standard.unitWeight : null;
      const herbEventUnitWeightG = herbSpecs.event ? herbSpecs.event.unitWeight : null;
      const herbStandardFinishedWeightG = isCombinedHerb && herbStandardUnitWeightG != null ? herbStandardPackageCount * herbStandardUnitWeightG : null;
      const herbEventFinishedWeightG = isCombinedHerb && herbEventUnitWeightG != null ? herbEventPieceCount * herbEventUnitWeightG : null;
      const baseFinishedWeight = isCombinedHerb
        ? (herbStandardFinishedWeightG == null || herbEventFinishedWeightG == null ? null : herbStandardFinishedWeightG + herbEventFinishedWeightG)
        : (isGibier ? gibierMetrics.actualCompletedWeight : (unitWeight == null ? null : completedNumber * unitWeight));
      const finishedWeight = baseFinishedWeight == null ? null : baseFinishedWeight + togeAllocatedWeight;
      const yieldRate = isGibier ? gibierMetrics.yieldRate : (finishedWeight == null || theoreticalFinishedWeight <= 0 ? null : finishedWeight / theoreticalFinishedWeight * 100);
      return {
        prepDate: elements.recordPrepDate.value,
        date: elements.recordDate.value,
        category: option.category,
        recipeId: option.id,
        productId: packagingProductIdForOption(option),
        packagingId: packagingSpec ? packagingSpec.packagingId : "",
        recipeName: isCombinedHerb ? "ハーブ" : option.label,
        savedRecipeName: option.savedRecipeName || option.label,
        recipeCode: isCombinedHerb ? "HERB" : (option.packagingKey === "herbProduct" ? "HERB-P" : option.packagingKey === "herbEvent" ? "HERB-E" : recipeCodeForRecipe(option.recipe)),
        packagingKey: option.packagingKey || "",
        packagingUnit,
        packageCountLabel: packagingSpec ? packagingSpec.countLabel : (packagingUnit === "本" ? "完成本数" : "包装数"),
        unitWeightLabel: packagingSpec ? packagingSpec.unitWeightLabel : (packagingUnit === "本" ? "1本重量" : "1包装重量"),
        unitPiecesLabel: packagingSpec ? packagingSpec.unitPiecesLabel : "",
        recipeKind: option.recipe.kind,
        lot: savedCalculation && savedCalculation.lot ? savedCalculation.lot : generateManufacturingLot(elements.recordDate.value, option.category, option.recipe, option.packagingKey),
        memo: elements.recordMemo.value.trim(),
        savedRecipeId: savedCalculation ? savedRecipeRecordId(savedCalculation) : "",
        savedCalculationId: savedCalculation ? savedRecipeRecordId(savedCalculation) : "",
        savedCalculation: Boolean(savedCalculation),
        meat6mm: savedCalculation ? Number(savedCalculation.meat6mm || 0) : 0,
        meat3mm: savedCalculation ? Number(savedCalculation.meat3mm || 0) : 0,
        meatTotal: savedCalculation ? Number(savedCalculation.meatTotal || 0) : 0,
        waterAmount: savedCalculation ? Number(savedCalculation.waterAmount || 0) : 0,
        emulsionWeight: savedCalculation ? Number(savedCalculation.emulsionWeight || 0) : 0,
        totalWeight: savedCalculation ? Number(savedCalculation.totalWeight || 0) : 0,
        theoreticalFinishedWeight,
        recipeRows: savedCalculation ? savedCalculation.rows : [],
        recipeTotal: savedCalculation ? Number(savedCalculation.total || 0) : 0,
        packagingUnit,
        packageCount,
        completedCount,
        herbStandardPackageCount,
        herbEventPieceCount,
        herbStandardPackagingId: herbSpecs.standard ? herbSpecs.standard.packagingId : "",
        herbEventPackagingId: herbSpecs.event ? herbSpecs.event.packagingId : "",
        herbStandardUnitWeightG,
        herbEventUnitWeightG,
        herbStandardFinishedWeightG,
        herbEventFinishedWeightG,
        smokedCount,
        unsmokedCount,
        lossCount: elements.recordLossCount.value,
        leftoverWeight: elements.recordLeftoverWeight.value,
        packWeight: unitWeight,
        packPieces: unitPieces,
        unitWeight,
        unitPieces,
        togeAllocationEnabled,
        togeAllocationId,
        togeAllocationUuid: togeAllocationEnabled ? togeAllocationId : "",
        togePieceCount,
        togeAllocatedWeight,
        togeComponentType: togeAllocationEnabled ? togeComponentType : "",
        finishedWeight,
        yieldRate,
        savedUnitWeightG: unitWeight,
        actualFinishedWeightG: finishedWeight,
        actualYieldPercent: yieldRate
      };
    }

    function buildManufacturingRecordText(record) {
      const isGibier = isGibierManufacturingRecord(record);
      const isCombinedHerb = isCombinedHerbManufacturingRecord(record);
      const countLabel = record.packagingUnit === "本" ? "完成本数" : "包装数";
      const countValue = record.packagingUnit === "本" ? record.completedCount : record.packageCount;
      const lines = [
        "【製造記録】",
        "",
        `仕込み日：${record.prepDate || ""}`,
        `製造日：${record.date || ""}`,
        `製造区分：${record.category || ""}`,
        `レシピ名：${record.recipeName || record.product || ""}`,
        `ロット番号：${record.lot || ""}`,
        "",
        `肉重量合計：${formatRecordNumber(record.meatTotal)}g`,
        `水：${formatRecordNumber(record.waterAmount)}g`,
        `乳化生地重量：${formatRecordNumber(record.emulsionWeight)}g`,
        `合計重量：${formatRecordNumber(record.totalWeight)}g`,
        "",
        ...(isCombinedHerb ? [
          `製品用：${record.herbStandardPackageCount || 0}パック`,
          `イベント用：${record.herbEventPieceCount || 0}本`
        ] : isGibier ? [
          `燻製本数：${record.smokedCount || 0}`,
          `燻製なし本数：${record.unsmokedCount || 0}`,
          `完成本数：${record.completedCount || 0}`
        ] : [`${countLabel}：${countValue || ""}`]),
        ...(record.togeAllocationEnabled ? [`峠の茶屋用：${record.togePieceCount || 0}本`] : []),
        `ロス本数：${record.lossCount || ""}`,
        `余り重量：${formatRecordNumber(record.leftoverWeight || 0)}g`,
        `完成重量：${record.finishedWeight == null ? "計算不可" : `${formatRecordNumber(record.finishedWeight)}g`}`,
        `実績歩留まり：${yieldDisplayText(record)}`,
        "",
        `メモ：${record.memo || ""}`
      ];
      return lines.join("\n");
    }

    function loadManufacturingRecords() {
      const parsed = readStorageArray(MANUFACTURING_RECORDS_KEY, OLD_MANUFACTURING_RECORDS_KEY);
      const normalized = parsed.map((record, index) => {
        let item = record;
        if (!item.manufacturingRecordId && !item.id) {
          const manufacturingRecordId = `manufacturing-record-${item.savedAt || item.createdAt || "legacy"}-${index}`;
          item = { ...item, id: manufacturingRecordId, manufacturingRecordId };
        }
        const packagingUnit = item.packagingUnit || (item.packageCountLabel === "完成本数" ? "本" : (item.packageCountLabel ? "袋" : ""));
        const packageCount = packagingUnit === "本" ? "" : (item.packageCount || "");
        const completedCount = packagingUnit === "本" ? (item.completedCount || item.packageCount || "") : (item.completedCount || "");
        const smokedCount = Number(item.smokedCount || 0);
        const unsmokedCount = Number(item.unsmokedCount || 0);
        const recipeRows = Array.isArray(item.recipeRows) ? item.recipeRows : [];
        const hasRecipeRows = recipeRows.length > 0;
        const storedRecipeTotal = Number(item.recipeTotal != null ? item.recipeTotal : item.total);
        const recipeTotal = Number.isFinite(storedRecipeTotal) && storedRecipeTotal > 0
          ? storedRecipeTotal
          : sumRows(recipeRows);
        const meatTotal = Number(item.meatTotal || 0);
        const rowWaterAmount = Number(amountFromRows(recipeRows, "水"));
        const waterAmount = hasRecipeRows
          ? rowWaterAmount
          : Number(item.waterAmount || 0);
        const ingredientTotal = hasRecipeRows ? sumIngredientRows(recipeRows) : 0;
        const storedTotalWeight = Number(item.totalWeight || 0);
        const totalWeight = hasRecipeRows
          ? meatTotal + ingredientTotal
          : (storedTotalWeight > 0 ? storedTotalWeight : meatTotal);
        const theoreticalFinishedWeight = Number(item.theoreticalFinishedWeight || 0) > 0
          ? Number(item.theoreticalFinishedWeight)
          : totalWeight;
        const hasGibierCounts = Object.prototype.hasOwnProperty.call(item, "smokedCount") || Object.prototype.hasOwnProperty.call(item, "unsmokedCount");
        const gibierMetrics = calculateGibierProductionMetrics(smokedCount, unsmokedCount, theoreticalFinishedWeight);
        const storedFinishedWeight = item.actualFinishedWeightG != null ? item.actualFinishedWeightG : item.finishedWeight;
        const finishedWeight = storedFinishedWeight == null || storedFinishedWeight === ""
          ? (isGibierManufacturingRecord(item) && hasGibierCounts ? gibierMetrics.actualCompletedWeight : null)
          : Number(storedFinishedWeight);
        const storedYieldRate = item.actualYieldPercent != null ? item.actualYieldPercent : item.yieldRate;
        const yieldRate = storedYieldRate == null || storedYieldRate === ""
          ? (finishedWeight == null || theoreticalFinishedWeight <= 0 ? null : finishedWeight / theoreticalFinishedWeight * 100)
          : Number(storedYieldRate);
        const savedUnitWeightG = inferSavedUnitWeight({ ...item, packagingUnit, packageCount, completedCount }, finishedWeight);
        const normalizedItem = {
          ...item,
          packagingUnit,
          packageCount,
          completedCount: isGibierManufacturingRecord(item) && hasGibierCounts ? String(gibierMetrics.completedCount) : completedCount,
          smokedCount,
          unsmokedCount,
          waterAmount,
          totalWeight,
          theoreticalFinishedWeight,
          leftoverWeight: item.leftoverWeight || "0",
          recipeTotal,
          finishedWeight,
          yieldRate,
          savedUnitWeightG,
          actualFinishedWeightG: finishedWeight,
          actualYieldPercent: yieldRate
        };
        return normalizedItem;
      });
      return normalized.filter((record) => record.status !== "deleted");
    }

    function saveManufacturingRecords(records) {
      localStorage.setItem(MANUFACTURING_RECORDS_KEY, JSON.stringify(records));
    }

    function manufacturingRecordId(record) {
      return record.manufacturingRecordId || record.id;
    }

    let manufacturingDiagnosticsVisible = false;
    let manufacturingDiagnosticRun = null;

    function renderManufacturingRecordHistory(records, message = "", cacheNotice = "", diagnostics = null) {

      app.innerHTML = `

          ${cacheNotice ? `<div class="note">${escapeHtml(cacheNotice)}</div>` : ""}
          ${diagnostics ? `<div class="note">同期診断：端末IndexedDB ${diagnostics.indexedCount}件 / 旧ローカル ${diagnostics.legacyCount}件 / 未同期 ${diagnostics.pendingCount}件 / クラウド取得 ${diagnostics.cloudCount == null ? "未確認" : diagnostics.cloudCount + "件"}${diagnostics.syncError ? ` / エラー: ${escapeHtml(diagnostics.syncError)}` : ""}</div>` : ""}
          ${window.MeatCrossDeviceSync ? `<div class="note">${escapeHtml(crossDeviceSyncStatusText())}</div>` : ""}
          <div class="record-actions" style="margin-bottom: 12px;">
            <button id="recordHistoryRefresh" class="secondary" type="button">最新データに更新</button>
